# Wording for the finish call (mill): after the last chapter, one model call reads the chapters' event records and writes the most notable change
# the whole story made to each person. English always; the values it writes are in the story's language.

languages: {en: English, zh: Simplified Chinese, ja: Japanese, ko: Korean, fr: French, de: German, es: Spanish}

role: "A story has been told from its first chapter to its last. You are not writing it; you are reading back over it to record how its people ended up different from how they began."
protagonist: "The story follows {name}."
opening_normal: "Before anything broke it, ordinary life was this: {value}"
opening_break: "What broke that ordinary life: {value}"
chapters_lead: "What happened in each chapter, and what it changed:"
people_lead: "The people as they were before the story began. Items in a list carry a handle, which is how you point at them:"
person_head: "{name}: {sketch}"
field_line: "{key}: {value}"
item_line: "{handle}: {text}"

# The task is a judgement of the whole story, one person at a time. A change must come from the records above, and a person the story did not move gets nothing.
task: "For each person, decide whether the story as a whole changed them in a way that matters: a want that was given up or came to rule them, a fear faced or deepened, a flaw overcome or sunk into, a way of acting that is no longer the same. Look at where the story left them, not at any one chapter. Choose the single most notable change for that person and record it in one entry. Base every change on what the records above say happened, and do not invent one. A person the story did not truly change gets no entry."
rules: "Write at most one entry for each person, never two. An entry has three parts: card, always characters; target, the person's name exactly as written above; and patch, holding only the fields that changed. In a patch a single-value field takes its new value, written in full in the way the old one is written, and a list field takes a list of replace operations, each with the handle of the item and only the values that changed. Point at items only by the handles shown. The fields that may change are: {fields}. Nothing else changes."
finish_example: "An entry is shaped as follows: {\"card\": \"characters\", \"target\": \"<the person's name>\", \"patch\": {\"fear\": \"<what they fear now>\"}}"
format: "Reply with a JSON object with one key, shifts, holding the list of entries, which is empty when nobody changed in a way that matters. Write every value in {language}; the keys, the card and the names stay as shown."
