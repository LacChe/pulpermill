# Wording for the generate call (mill): three steps, write (prose), events (JSON) and shifts (JSON: the new edge of ties). Read through common.load_text("generate").
# English always; the story's language is named inside the prompts. Wording is positive. R3 to R7 mark the design rule a block serves.
#
# WHY THE WRITER PROMPT IS BUILT THIS WAY (Gemma 3 27B, instruction-tuned, 16k context, abliterated):
#  * One role and one task, stated first and said again in one closing line. A 27B model weighs the opening and the last lines most, so
#    the task sits at both ends and the cards sit between them.
#  * The plan is the spine and comes right after the task, before the cards: the model reads everything else as material for the plan.
#  * Cards arrive as prose paragraphs (the renderers), never as key: value lists, and the craft guidance is prose in the second person
#    ("you"). Checklist-shaped input gives a checklist-shaped story, and the model otherwise ticks items off one by one.
#  * Craft guidance asks for qualities (stakes, specific detail, costly choices, subtext, a turn that is earned, a changed ending) and
#    gives no list of items to cover, no word list and no bans.
#  * The plan's Act labels are planning scaffolding: the writer is told to move through the four points without printing them.
#  * Context blocks are headed with short plain titles, so the model can find the plan, the voice and the ending again at a glance.
#  * Sampling is the Config's `prose` set (temperature 1.0): invention comes from the sampler and the craft paragraph, not from extra rules.

languages: {en: English, zh: Simplified Chinese, ja: Japanese, ko: Korean, fr: French, de: German, es: Spanish}

headings:
  voice: "The voice of the story"
  setup: "Where the story stands"
  plan: "The plan for this chapter"
  cast: "The people on stage"
  spotlight: "The tie in the spotlight"
  world: "The world"
  entanglements: "Ties and holdings"
  history: "The story so far"
  ending: "How the last chapter ended"
  craft: "How to write it"

# One role, one task.
role: "You are a novelist writing chapter {chapter} of {total} of a story. Write the whole chapter as finished prose in {language}. Everything below is what you know about the story and this chapter; the chapter itself is yours to bring to life."
role_unknown_total: "You are a novelist writing chapter {chapter} of a story. Write the whole chapter as finished prose in {language}. Everything below is what you know about the story and this chapter; the chapter itself is yours to bring to life."

# R3/R7. The plan as the spine; the four points are followed without labels.
plan_note: "This plan is the spine of the chapter. It is organised in four points, Act 1 to Act 4. The labels belong to the planning: write one continuous chapter that moves through the four points in order, with no labels, no headings and no list of events. Give the fourth point its own scene: the chapter lands there, and it is where the collision of this chapter is shown decided."

# R3. Voice: the Style paragraph comes from the renderer; person and tense in it are rules.
voice_rule: "Person and tense are rules: keep every sentence in the voice above, in the narration, in thoughts and in the tags around dialogue, from the first sentence to the last."

# Continuity. {previous} is the number of the chapter before.
ending_lead: "Chapter {previous} ended with the passage below. It is background, there so that you keep continuity: everything it established stays true. Chapter {chapter} starts with a new moment that follows from it (a little later, somewhere else, or the next thing that happens), and its first sentence is a new one."

# R3. Craft guidance in second person prose; four paragraphs, no checklist. (R5, minor characters, is stated once, in the plan block: frames.yaml scene_minor_roles.)
craft_interest: "Make this a chapter someone wants to keep reading. Build scenes where something is at stake and a person could lose something before the scene ends. Prefer the specific detail and the surprising one to the generic one. Give the people wants of their own, let them make choices that cost them, and let their flaws and fears get in their way."
craft_dialogue: "Write dialogue with subtext. People in a tense scene rarely say exactly what they mean: they change the subject, answer a different question, or say the safe thing while the real one sits underneath. Keep the amount and manner of dialogue to the measure the voice above sets."
craft_turn: "Prepare a turn the reader did not see coming but accepts once it lands, because it grows from what these people want and from what the chapter has already shown. Let the climax land in something a person does or decides that cannot be taken back, rather than in a thought."
# R6. The change on the page.
craft_change: "By the end of the chapter the collision between the protagonist's aim and the tie in the spotlight must be settled on the page: show how it ends, through what people do and say, and let it cost something that stays spent. Then leave both changed by that ending, the protagonist wanting something new and the tie standing differently, each grown out of how the collision ended, which makes the next chapter matter."
craft_change_last: "By the end of the chapter the collision between the protagonist's aim and the tie in the spotlight must be settled on the page: show how it ends, through what people do and say, and let it cost something that stays spent. Then end the story on a moment that settles what it set in motion, with the aim and the tie in their final state and nothing new opened."

# Length (decided 3 Nov: at most 1,200 words). Stated positively as a complete chapter that fits the cap and ends on a finished beat; the closing line stays the
# last line of the prompt. Chinese is counted in characters at twice the word figure (the trials kit's own ratio), so 2,400 characters.
closing: "Write only the text of the chapter, in {language}, from its first sentence to its last: no title, no notes and no summary after the end. Write a complete chapter of up to {cap}, aiming for roughly {aim}, so that it reads whole and ends on a finished beat."
length:
  en: {cap: "1,200 words", aim: "900 to 1,200 words"}
  zh: {cap: "2,400 Chinese characters", aim: "1,800 to 2,400 Chinese characters"}
write_problems:
  echo: "The chapter opens by repeating the end of the last chapter. Begin with a new moment that follows from that ending, and make the first sentence new."
  unknown_person: "The chapter uses {names}, capitalised words that are on no card. If one of them is a person, refer to that person by what they do or by one telling detail."
  too_long: "Shorten the chapter to at most {cap} by keeping the scenes the plan needs and cutting the rest."

# ---- events step ----
events_task: "Below is chapter {chapter} of a story. Record what actually happened in it, from the text itself, in {language}."
events_aim: "The chapter was meant to follow this: the protagonist was after {aim} {tie}"
events_tie: "The tie in the spotlight was {tie_from} toward {tie_to}, and at the start its edge was: {edge}"
events_format: "Reply with a JSON object with two keys. happened: plain sentences covering what occurred, in order: who did what, where, and how it turned out. Use the characters' names, and refer to anyone unnamed by their role. changed: one or two short sentences. The first sentence says, in this order, {ended}, and then the one concrete thing the protagonist goes after next, with a person, an object or a deadline in it. {next} A state of mind or a feeling is not an aim, and a wish to understand or find out counts only when it is tied to a specific person, object or deadline. Base the outcome and the aim on what the protagonist did and on what changed in the world or between people, not on what they realized, felt or concluded at the end of the chapter."
events_ended_given: "that the collision of the protagonist's aim and the tie in the spotlight ended the way the chapter was planned to end, stated plainly as a fact and never hedged"
events_ended_any: "how the collision of the protagonist's aim and the tie in the spotlight ended, stated plainly as a fact and never hedged, as the protagonist reaching what they were after, losing it, or giving it up"
events_next_new: "After the protagonist reached what they were after, what they go after next is a new pursuit and not the old aim stated again."
events_next_forced: "After the protagonist lost what they were after or gave it up, what they go after next is what they turned to, or what the loss now forces."
events_next_any: "If the protagonist reached what they were after, what they go after next is a new pursuit and not the old aim stated again; if they lost it or gave it up, it is what they turned to, or what the loss now forces."
events_chapter_lead: "The chapter:"
events_problems:
  empty_happened: "Say in plain sentences what happened in the chapter."
  empty_changed: "Add one short sentence naming what is different at the end of the chapter."

# ---- shifts step ----
shifts_task: "Below is chapter {chapter} of a story and the ties it was written from. Record how the edge of the ties changed in this chapter: what now drives the person at the from end of a tie, compared with the start of the chapter."
shifts_happened_lead: "What happened in the chapter, as its summary records it:"
shifts_changed_lead: "What the chapter changed, as its summary records it:"
shifts_cards_lead: "The ties as they stood before the chapter, with the handles you can point at:"
shifts_rules: "Write one entry for the ties: it names the card (entanglements) and holds a patch with a ties list of replace operations, each with the handle of a tie and its new edge, and its new bond only when the chapter changed it. Change only the edge and the bond of a tie, and only for ties the chapter moved. Nothing else on any card changes. Point at ties only by the handles shown."
shifts_example: "An entanglements entry that replaces the edge of a tie looks like this: {\"card\": \"entanglements\", \"patch\": {\"ties\": [{\"op\": \"replace\", \"id\": \"ties.1\", \"values\": {\"edge\": \"to <what now drives the person at the from end>\"}}]}}"
# R6. The spotlight tie's edge must be replaced.
shifts_edge: "The tie in the spotlight is {tie_from} toward {tie_to} ({handle}); its edge was: {edge}. Replace that edge in the entanglements entry with its new state: what now drives {tie_from} in this tie, as the chapter left it. Start from what the last events of the chapter left standing, not from the old edge. The new edge must differ from the old one."
shifts_edge_any: "The tie in the spotlight is one of these: {ties}. Replace the edge of the one the chapter was about in the entanglements entry with its new state: what now drives the person at the from end in this tie, as the chapter left it. Start from what the last events of the chapter left standing, not from the old edge. The new edge must differ from the old one."
shifts_edge_item: "{handle}, {tie_from} toward {tie_to}, edge: {edge}"
shifts_edge_move: "First read how the chapter answered what the person at the from end wanted from the other person: it was given, at a price; or refused; or dropped for something else. The tie is different afterwards, so write what it is now. If the want was given, it is met, and the new edge is what the price now makes the person at the from end want. If it was refused, the new edge turns against the other person, or a fear joins the want so that the person is pulled two ways. If it was dropped, the new edge points at what they turned to instead: a different thing, person or place. The new edge is always a different want, never the old want made stronger, costlier or more urgent, and never the same want in other words."
shifts_bond: "If the chapter changed what the two are to each other, also replace the bond in the same entry: write what they are to each other now, and keep what is still true of the old bond. When the bond changes, write the new edge so that it fits the new bond. If the bond did not change, leave it out."
shifts_form: "The new edge names what the person wants or fears as a concrete person, thing, place or deadline, and it states a want, not a mood, a manner or a trend. It names the thing the person wants from the other person, or fears from them, and stops there, without saying what the want is for or what it will show. The bond is a short noun phrase naming what the two are to each other; it does not describe a feeling, a manner or a trend."
shifts_format: "Reply with a JSON object with one key, shifts, holding the list of entries."
shifts_problems:
  edge_not_moved: "Add an entanglements entry whose ties list replaces the edge of {handle} ({tie_from} toward {tie_to}) with its new state, different from {edge}."
  edge_not_moved_any: "Add an entanglements entry whose ties list replaces the edge of the tie the chapter was about with its new state, different from its old edge."
