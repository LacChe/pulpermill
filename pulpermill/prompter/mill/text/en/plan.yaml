# Wording for the plan call (mill). Read through common.load_text("plan"). English always: the story's language is named inside the prompt.
# Wording is positive (what to do), one role and one task, prose sentences. Each block says which design rule it serves (R3 to R7).
# Nothing here carries an id or a raw option key: the renderers turn cards into prose, and names are used throughout.

# Display names for the language codes the page sends. A code not listed here is used as it is.
languages: {en: English, zh: Simplified Chinese, ja: Japanese, ko: Korean, fr: French, de: German, es: Spanish}

headings:
  tone: "The tone of the story"
  setup: "Who the story follows"
  cast: "The people"
  world: "The world"
  entanglements: "Ties and holdings"
  spotlight: "The tie in the spotlight"
  combinations: "The three combinations"
  combination: "The combination"
  choices: "The combinations you may choose from"
  history: "The story so far"
  brainstorm: "Three ideas for this chapter"
  decide: "The options to judge"
  decided: "The idea for this chapter"
  task: "Your task"

# One role and one task, stated first. The planner designs; it does not write the chapter.
role: "You are the planner of a story that is written one chapter at a time. Your job is to design the plan for chapter {chapter} of {total}: a plan that moves the story forward and gives the writer an engine to run on. You do not write the chapter; you decide what happens in it."
role_unknown_total: "You are the planner of a story that is written one chapter at a time. Your job is to design the plan for chapter {chapter}: a plan that moves the story forward and gives the writer an engine to run on. You do not write the chapter; you decide what happens in it."

# R4. The collision: the aim meets the spotlight tie.
method: "The engine of a chapter is a collision. The protagonist goes after one concrete thing, and the tie in the spotlight meets them on the way: it blocks them, pulls them somewhere else, or names a price for what they want. Choose the protagonist's aim for this chapter so that it runs straight into the spotlight tie, and let the meeting between the two be where the conflict of the chapter lives. How the meeting goes is for the plan to decide, and the plan should decide it in a way that surprises a little and still follows from who these people are."

# R4/R6. The aim: concrete, doable inside one chapter, and from the second chapter on it follows from how the last collision ended.
aim_rules: "The aim is one thing the protagonist can try to get or do inside this single chapter, something a reader could watch happen. From the second chapter on, the aim follows from how the last collision ended, which the story so far shows. If the protagonist reached what they were after, the aim is what that makes possible or what it cost them. If they lost it, the aim is what they do about the loss. If they gave it up, the aim is what they turn to instead. If the last collision was left open, the aim continues it. A new aim is allowed when the old one has ended. The obstacle, the person or the stake in the way may be new. A state of mind or a feeling is not yet an aim; turn it into something to get, reach or do, with a person, an object or a deadline in it."

# R7. Four points per chapter, whatever the chapter count. The labels stay in English so a check can find them.
four_points: "Write the plan as four points, in this order, each starting with its label exactly as written here (keep the labels in English whatever language the story is in). Act 1 is the starting point: who is there, where and when. Act 2 is where the central conflict emerges, as the aim meets the spotlight tie. Act 3 is the climax or turning point: the moment where something gives, a choice costs something, and the collision of the chapter is decided for good. Act 4 is the end point: how the collision came out and where the chapter leaves the people and the situation, told through what they do and what is now different, in facts and actions a reader could watch. Each point says what people do and choose, in concrete actions."
other_person: "Act 2 says what {other} wants from this chapter and what {other} does about it, so that the tie is a person who acts and never a backdrop."
spotlight_names: "Name both ends of the spotlight tie, {tie_from} and {tie_to}, in the plan (a first or last name is enough, written as on the cards), so that the writer knows whose tie the chapter is about."

# R6. Both must move, distinctly.
movement: "The end point must stand clearly apart from the starting point, and it must grow out of how the collision ended. By the end of the chapter, the edge of the spotlight tie (what drives {tie_from} in it) and the protagonist's aim must each have moved to a distinctly new state: the aim reached, lost or turned into a new one, the edge met, broken or changed into something different from what it was. Show both in Act 4 through what people do and the facts that have changed (a thing held, lost or moved, a place, a promise, a standing between people), and end Act 4 on the one consequence the outcome leaves standing for the next chapter, with a person, an object or a date in it."
movement_last: "The end point must stand clearly apart from the starting point, and it must grow out of how the collision ended. By the end of the chapter, the edge of the spotlight tie (what drives {tie_from} in it) and the protagonist's aim must each have reached a final state: the aim reached, lost or given up, the edge met, broken or mended for good. Show both in Act 4 through what people do and the facts that have changed (a thing held, lost or moved, a place, a promise, a standing between people), with nothing left open."

# R5. Minor characters: the reason, the method (what they do, one telling detail) and the scale (only people are limited), never the carriers of the plot.
people_rule: "The cast is fixed, so the plan names only people from the cards: a new name is a new character to keep track of. Anyone else appears by what they do or one telling detail taken from this story's own world and never carries the plot. Places, events and things may have proper names; no other person does. People on stage outside the spotlight tie are supporting: they pull on the tie or react to it, and the chapter stays about the tie."

# R7. Where the chapter sits.
first_chapter: "This is the first chapter. Act 1 opens from the ordinary life and the disruption described under the heading about who the story follows, and the conflict of Act 2 grows out of that disruption. Like every chapter, it settles its own collision by its end, and the story goes on from the new state that outcome leaves."
middle_chapter: "Build on what the earlier chapters changed: begin from where they left the people and the situation, and let the aim for this chapter follow from how the last collision ended, as the story so far shows it. This chapter settles the collision it sets up, completely. At its climax the aim and the spotlight tie meet and the meeting is decided in a way that cannot be undone: the aim is reached, lost or given up, and the tie is met, broken, bent or mended. Leave nothing of that collision hanging at the end of the chapter. The story goes on from what the outcome leaves behind, so choose a setting and a turn that the earlier plans have not used."
last_chapter: "This is the last chapter. Act 3 is the climax of the whole story, and Act 4 closes it: settle the collision and everything the story set in motion, bring the protagonist's aim and the spotlight tie to their final state, and open nothing new."

# What the planner is shown of the past, besides the story so far.
# The running aim: one aim that moves a step each chapter. Built in code from each earlier chapter's aim and its `changed` line.
chain_lead: "The protagonist's running aim, chapter by chapter, oldest first. Each line gives the chapter's aim and how that chapter ended:"
chain_item: "Chapter {chapter}: aim: {aim}"
chain_latest: "Chapter {chapter} (the latest): aim: {aim}"
chain_ended: " It ended: {changed}"
chain_now: "Where the aim stands now, at the end of chapter {chapter}: {changed}"

# The brainstorm: a short free-text step before the plan. It thinks of three chapters that differ in kind; the plan step then chooses.
# {other} is the person at the other end of the spotlight tie from the protagonist.
brainstorm_role: "You are the planner of a story that is written one chapter at a time. Before the plan for chapter {chapter} of {total} is written, you think the chapter through: you propose three different ways it could go. You do not write the chapter and you do not choose yet."
brainstorm_role_unknown_total: "You are the planner of a story that is written one chapter at a time. Before the plan for chapter {chapter} is written, you think the chapter through: you propose three different ways it could go. You do not write the chapter and you do not choose yet."
brainstorm_first: "This is the first chapter, so each option opens from the ordinary life and the disruption described under the heading about who the story follows, and each decides its own collision by its end."
brainstorm_last: "This is the last chapter, so each option settles the collision and everything the story set in motion, and brings the protagonist's aim and the spotlight tie to their final state, with nothing new opened."
brainstorm_method: "The engine of a chapter is a collision. The protagonist goes after one concrete thing, and the tie in the spotlight meets them on the way: it blocks them, pulls them somewhere else, or names a price for what they want. Every option you propose has such a collision in it, and the meeting between the two is where its conflict lives."
brainstorm_people: "The cast is fixed, so your options name only people from the cards: a new name is a new character to track. Anyone else appears by what they do or one telling detail and never carries the plot. Places, events and things may have proper names; no other person does. People on stage outside the spotlight tie are supporting: they pull on it or react to it, and each option stays about the tie."
brainstorm_task: "Propose three ways to take the protagonist's aim its next step in this chapter. All three go after the same concrete thing. They differ from each other in what stands in the way, who is involved, where it happens and what is at stake. Think each one up from the situation above."
brainstorm_outcomes: "Write exactly three ideas, numbered 1 to 3, and no more. The number fixes how the idea ends: idea 1 ends with the protagonist reaching what they are after, at a price; idea 2 ends with them losing it; idea 3 ends with them giving it up for something else."
brainstorm_parts: "Each idea says, in plain sentences: what the protagonist is after (one concrete thing); what {other} wants from this chapter and does about it, never simply agreeing or giving way; the line or moment where the two of them clash; what the protagonist puts at risk and what it costs if they lose it; and how the collision ends, in the way its number fixes, and what that leaves behind that cannot be redone in a later chapter."
brainstorm_risk: "What the protagonist puts at risk is one specific thing the cards above show to matter: a tie's edge, something a person wants, fears, values or is blind to, a deadline, a rule's cost, an object's stake, or the disruption the story began from. Name it, and prefer the things the cards treat as central over the minor ones. The cost is a concrete loss that would hurt and change what happens next, never a comfort or a convenience. Make the stakes real, and let them grow as the story goes on."
brainstorm_variety: "Look at where the earlier chapters happened, who was on stage and what stood in their way. Each idea differs from them in at least one of these, drawing on the places of the world and the people of the cards that the earlier chapters used least."
brainstorm_output: "Reply in plain prose in {language}. Start each idea on its own line with its header, exactly Option 1, Option 2 or Option 3 (keep the headers in English whatever language the story is in), and write about 130 words for each idea. Keep every name exactly as it is written above."
brainstorm_retry: "An earlier plan for this chapter was refused. Its aim was: {aim} These problems need fixing: {problems} Propose options that fix them and differ from that aim."
# The plan step, once a brainstorm exists: the text goes in under its own heading, and this line sends the planner to it.
choose_from: "The three ideas above are your own earlier thinking. Choose one of them, or combine two, and build the plan on it. The aim you give is the aim of the idea you chose, in one sentence, and from the second chapter on it follows from how the last collision ended."
idea_use: "Begin your reply with idea_use: one sentence that says which idea you build on, or which two you combine (by number), and what you take from it."
idea_use_chain: "Begin your reply with idea_use: one sentence that says which idea you build on, or which two you combine (by number), what you take from it, and how its aim follows from how the last collision ended."

# Choose mode (the request has `choose`): a select step first picks three combinations, each one tie and one rule or object of the world.
# The brainstorm then writes one idea per combination and the plan chooses one idea. The model answers by number; ids stay in code.
select_role: "You are the planner of a story that is written one chapter at a time. Before chapter {chapter} of {total} is thought through, you choose what it is built on: three combinations, each one tie between two of the people and one rule or object of the world."
select_role_unknown_total: "You are the planner of a story that is written one chapter at a time. Before chapter {chapter} is thought through, you choose what it is built on: three combinations, each one tie between two of the people and one rule or object of the world."
select_ties_lead: "The ties you may choose:"
select_pressures_lead: "The rules and objects you may choose:"
tie_item: "{n}. {tie}"
tie_words: "{tie_from} and {tie_to}: {bond}{edge}"
tie_edge: " (edge: {edge})"
pressure_item: "{n}. ({kind}) {element}"
select_task: "A combination is one tie and one rule or object of the world that the chapter will put to work. A good combination is one where the rule or object bears on the tie and on what the protagonist is likely to go after, so that they cannot both be had. Choose three combinations that differ from each other: no two use the same tie with the same rule or object, and the three differ in their ties and in their rules or objects wherever the lists allow it. When the lists allow fewer than three different combinations, give as many different ones as they allow and repeat the best. For each one, say in one or two sentences (at most 700 characters) how the tie and the rule or object collide, then give the number of the tie and the number of the rule or object. The chapters so far are listed with the tie and the rule or object each one was about: prefer a tie and a rule or object that the story has used the least lately, and come back to one only when the story gives a reason to."
select_task_no_pressure: "Choose three different ties for the chapter to be built on; when there are fewer than three ties, give each one and repeat the best. Each is a tie where what the protagonist is likely to go after meets the two people in it. For each one, say in one or two sentences (at most 700 characters) what makes it a good tie for this chapter, then give its number. The chapters so far are listed with the tie each one was about: prefer a tie that the story has used the least lately, and come back to one only when the story gives a reason to."
# Added to the select task from the second chapter on, when the story so far shows the running aim.
select_chain: "The story so far shows the protagonist's running aim. Choose combinations whose tie and rule or object can carry the next step of that aim from where the chapter before left it, whether by standing in its way, pulling it somewhere or putting a price on it. In each reason, say how the combination carries that next step."
select_output: "Reply with a JSON object with one key, picks: a list of exactly three combinations. Each combination has reason (write it first, in {language}), tie (the number of the tie) and pressure (the number of the rule or object)."
select_output_no_pressure: "Reply with a JSON object with one key, picks: a list of exactly three choices. Each has reason (write it first, in {language}) and tie (the number of the tie)."
combos_lead: "Each combination is one tie and one rule or object of the world. Its tie is the tie in the spotlight of the chapter built on it, and its rule or object is a part of that chapter's collision, whether or not it has anything to do with the aim or the tie to begin with: it enters the conflict and pulls against what someone wants. By the climax a rule is kept at its price, bent, or broken, with what follows its breaking, and an object, if the story goes that way, is used, damaged, lost or passes to someone else. Merely being in the scene does not count."
combo_head: "Combination {n}"
combo_tie: "The tie: {tie}"
combo_pressure: "The {kind}: {element}"
combo_reason: "How they may collide: {reason}"
brainstorm_combos: "The three ideas belong to the three combinations above, one idea for each, in order: idea 1 is built on combination 1, idea 2 on combination 2 and idea 3 on combination 3. Each idea's tie is the tie in the spotlight and its rule or object is what the idea puts to work. When two combinations are the same, the two ideas still differ in obstacle, person or place."
choose_one: "The three ideas above each belong to the combination of the same number. Choose one idea and build the plan on it alone: its combination's tie is the tie the chapter is about, and its rule or object is what the chapter puts to work. The aim you give is the aim of the idea you chose, in one sentence, and from the second chapter on it follows from how the last collision ended."
idea_number: "Begin your reply with idea: the number, 1 to 3, of the idea you build on. Then give idea_use: one sentence that says what you take from that idea."
idea_number_chain: "Begin your reply with idea: the number, 1 to 3, of the idea you build on. Then give idea_use: one sentence that says what you take from that idea and how its aim follows from how the last collision ended."
# After the decider: the one idea it chose, shown as idea 1 (and its combination as combination 1), and the plan builds on it.
outcome_reached: "The idea ends with the protagonist reaching what they are after, at a price. That ending stands: Act 3 decides the collision this way, and Act 4 shows the price and where it leaves the people."
outcome_lost: "The idea ends with the protagonist losing what they are after. That ending stands: Act 3 decides the collision this way, and Act 4 shows the loss and where it leaves the people."
outcome_gave_up: "The idea ends with the protagonist giving up what they are after for something else. That ending stands: Act 3 decides the collision this way, and Act 4 shows what they turn to and where it leaves the people."
decided_item: "Idea 1\n{text}"
decided_from: "The idea above is the one chosen for this chapter. Build the plan on it: keep its aim, the collision it sets up and how it ends, and design the chapter from there. The aim you give is the aim of that idea, in one sentence, and from the second chapter on it follows from how the last collision ended."
decided_use: "Begin your reply with idea_use: one sentence that says what you take from the idea, and how it ends."
decided_use_chain: "Begin your reply with idea_use: one sentence that says what you take from the idea, how it ends, and how its aim follows from how the last collision ended."
decided_one: "The idea above is the one chosen for this chapter, and it belongs to the combination above. Build the plan on it alone, keeping its aim, the collision it sets up and how it ends: the combination's tie is the tie the chapter is about, and its rule or object is what the chapter puts to work. The aim you give is the aim of the idea, in one sentence, and from the second chapter on it follows from how the last collision ended."
decided_number: "Begin your reply with idea: 1, the number of the idea above. Then give idea_use: one sentence that says what you take from it and how it ends."
decided_number_chain: "Begin your reply with idea: 1, the number of the idea above. Then give idea_use: one sentence that says what you take from it, how it ends, and how its aim follows from how the last collision ended."
choose_combo: "Choose one of the three combinations above and build the plan on it: its tie is the tie the chapter is about, and its rule or object is what the chapter puts to work. Begin your reply with idea: the number, 1 to 3, of the combination you chose."

# The decider (decide.py): one call between the brainstorm and the plan that judges the options and picks one. It shows each option under a
# letter in a random order, so nothing in the prompt says which option came first.
decide_role: "You are the judge of a story that is written one chapter at a time. Before chapter {chapter} of {total} is planned, you read the options proposed for it and choose the one that moves the story forward the most. You do not write or plan the chapter."
decide_role_unknown_total: "You are the judge of a story that is written one chapter at a time. Before chapter {chapter} is planned, you read the options proposed for it and choose the one that moves the story forward the most. You do not write or plan the chapter."
decide_item: "Option {label}\n{text}"
decide_built_on_lead: "It is built on:"
decide_task: "Each option is a way to take the protagonist's aim its next step in this chapter, and each stands under a letter in an order that means nothing. An option moves the story forward when a reader could point at something in it that the story does not already hold: a relationship that changes, something lost or gained, a new obstacle or place, a deadline that now bites. Judge what the option sets up and changes, not how it ends: how each option ends is already fixed, and a loss moves the story as much as a win. An option that only repeats what the story has already done, or only brings in a new named person while nothing else changes, moves the story little."
decide_combos: "Under each option you see the tie and the rule or object it is built on, and why they may collide; use them to judge what the option sets up and changes."
decide_move: "Work in this order. First say, in a few sentences, what the story holds now: where the last chapter left the protagonist's aim and the ties, as the story so far shows. Then, for each option, say what it adds that the story does not already hold, or what it repeats. Last, name the option that moves the story forward the most and the one that moves it the least."
decide_move_first: "Work in this order. First say, in a few sentences, what the story holds now: this is the first chapter, so take it from the setup and the disruption the story began from. Then, for each option, say what it adds that the story does not already hold, or what it repeats. Last, name the option that moves the story forward the most and the one that moves it the least."
decide_output: "Reply with a JSON object with one key, {criteria}, holding: held (what the story holds now, at most {held_limit} characters, in {language}), then one text for each option under its letter (what it adds that is new, or what it repeats, at most {limit} characters), written before best and worst: the letters of the option that moves the story forward the most and the one that moves it the least, two different letters."

# What to answer. The keys are the grammar's own (kit.grammar.plan_beat()).
output: "Reply with a JSON object with four keys. where: the place where the chapter opens, one of the places in the world. when_time: the day and time of day at which the chapter opens, in a few words; the scene is already in motion at that moment. aim: what the protagonist is after in this chapter, in one sentence. plan: the four points, Act 1 to Act 4, in about 150 words. Write when_time, aim and plan in {language}, and keep every name exactly as it is written above."

# A first attempt the page's rules refused (request.retry). The second attempt must fix every problem.
retry_lead: "A first attempt at this plan was refused. Its aim was: {aim} Its plan was: {plan} These problems need fixing:"
retry_close: "Plan the chapter again and make sure the new plan fixes every one of these problems."

# The check's lines. They are shown to the model on the second attempt, so each says what to do.
problems:
  brainstorm_short: "Write three ideas headed Option 1, Option 2 and Option 3, about 130 words each: what the protagonist is after, what the other person wants, where the two clash, what it costs and how it ends."
  brainstorm_count: "Write exactly three ideas, each starting on its own line with the header Option 1, Option 2 or Option 3, one idea each (when combinations are shown, one for each combination, in order), and finish the last idea in full sentences."
  unknown_person: "The plan uses {names}, capitalised words that are on no card. If one of them is a person, refer to that person by what they do or by one telling detail."
  missing_where: "Choose the place where the chapter opens, from the places in the world."
  missing_aim: "Give the protagonist's aim as one concrete thing to get or do inside this chapter."
  abstract_aim: "Make the aim something the protagonist can try to get or do and a reader can watch, instead of a state of mind."
  repeated_aim: "Aim at a different step than chapter {chapter}'s aim ({aim}), one that builds on what that chapter changed."
  same_as_retry: "Choose an aim that differs from the aim of the refused attempt ({aim})."
  missing_points: "Write the plan as four points labelled Act 1, Act 2, Act 3 and Act 4, in that order, each saying what happens; the plan is missing {missing}."
  missing_names: "Name {names} in the plan (a first or last name is enough), since the chapter is about the tie between them."
  idea_missing: "Say which idea you build on: idea is 1, 2 or 3."
  select_count: "Give exactly three combinations, each with a reason, a tie and (when there are rules or objects) a rule or object."
  select_reason: "Give pick {n} a reason of one or two sentences, in at most 700 characters."
  select_range: "Pick {n} must use a number from the lists: a tie from 1 to {n_ties}{rules}."
  select_range_rules: ", a rule or object from 1 to {n_pressures}"
  select_same: "Picks {a} and {b} are the same tie with the same rule or object; the three picks must hold at least {need} different combinations."
  decide_shape: "Give the criterion with held (what the story holds now), one text for every lettered option, and a best and a worst letter, in that order."
  decide_phrase: "Write held (what the story holds now) in at most 600 characters, and for every option a text of at most 400 characters on what it adds that is new or what it repeats."
  decide_best_worst: "Name two different letters from the options shown, the one that moves the story forward the most and the one that moves it the least."

# Data for the aim check, not shown to the model. An aim whose first verb (after "wants to", "needs to" and the like) names a state of
# mind is abstract; so is one that starts with an exact phrase below. The check is a net, not a proof; D tunes it against real plans.
abstract_verbs: [feel, understand, realize, realise, accept, heal, grow, process, reflect, reconcile, cope, reckon, ponder, contemplate, wonder, forgive]
abstract_starts: ["make peace", "come to terms", "find peace", "find closure", "find herself", "find himself", "find themselves", "find meaning", "figure out her life", "figure out his life", "figure out their life", "figure out who", "learn to let go", "learn to trust", "learn to love", "be happy", "be at peace"]
aim_lead_phrases: ["is trying to", "is determined to", "is after", "sets out to", "wants to", "needs to", "tries to", "hopes to", "aims to", "resolves to", "decides to", "plans to", "intends to", "seeks to", "must", "wants", "needs"]
