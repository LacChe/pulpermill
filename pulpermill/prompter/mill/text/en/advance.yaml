# Wording for the advancement judge (mill): two small JSON steps that ask whether a chapter really moved. One reads the protagonist's aim
# for a chapter against the running aim (the chain of earlier aims and endings); the other reads the edge of the spotlight tie against the edge it had before.
# Each is a classification, so the model sorts what it reads into one named kind and never compares wording. English always; the cards and
# the aims may be written in any language and are read as they are. Names, never ids.

# ---- The aim ----------------------------------------------------------------------------------------------------------------
# The protagonist has one running aim that moves a step each chapter. This judge only observes: it records whether the new aim continues the
# running aim and whether its obstacle or stake is new. No flow acts on its answers.
aim_role: "You are a careful reader of a story that is written one chapter at a time. The protagonist has one running aim that moves a step each chapter. You decide whether the aim planned for the new chapter continues that running aim from where the last chapter left it, and whether the obstacle or stake in its way is new."
protagonist_line: "The protagonist is {protagonist}."
tie_line: "The tie in the spotlight is {tie_from} toward {tie_to}, bond: {bond}."
tie_line_plain: "The tie in the spotlight is {tie_from} toward {tie_to}."
chain_lead: "The protagonist's running aim, chapter by chapter, oldest first. Each line gives the chapter's aim and how that chapter ended:"
chain_item: "Chapter {chapter}: aim: {aim}"
chain_latest: "Chapter {chapter} (the latest): aim: {aim}"
chain_ended: " It ended: {changed}"
chain_now: "Where the aim stands now, at the end of chapter {chapter}: {changed}"
new_aim_line: "The new aim, for chapter {chapter}: {aim}"
aim_questions: "Answer two questions. First, link: continues when the new aim is the next step of the running aim, taken on from where the last chapter left it, so that the protagonist is still after the same thing and has moved a step closer, further off or onto what the last ending opened; drifts when the new aim goes back to an earlier step, starts a different pursuit, or ignores where the last chapter left the aim. Second, new_obstacle: yes when the obstacle, the person or the stake in the way of the new aim differs from those in the last chapter's aim; no when they are the same. The two answers are independent, so an aim may continue with a new obstacle, continue with the same one, or drift. Judge by what the protagonist is after and what stands in their way, and let objects and settings fall away."
aim_answer: "Reply with a JSON object with three keys. reason: one short sentence that says how the new aim relates to where the last chapter left the aim and what, if anything, is new in its obstacle, person or stake. link: continues or drifts. new_obstacle: yes or no. Write reason in English and keep every name exactly as it is written above."

# ---- The edge ---------------------------------------------------------------------------------------------------------------
edge_role: "You are a careful reader of a story that is written one chapter at a time. You decide whether the edge of the spotlight tie moved in the chapter that just ended, or only came back in other words."
edge_what: "The edge of a tie is what drives {tie_from} in it: the want or the fear that {tie_from} brings to {tie_to}."
edge_trail_lead: "The edge in the earlier chapters, oldest first:"
edge_trail_item: "{edge}"
old_edge_line: "The edge before this chapter: {edge}"
new_edge_line: "The edge after this chapter: {edge}"
edge_moves: "Sort the change into one move. escalates: the same want, now stronger, costlier or more urgent, so that more is at stake. reverses: the want turns into its opposite, or turns against the other person. complicates: a second want or a fear joins the first, so that {tie_from} is pulled two ways. resolves: the want is met, given up, or no longer drives {tie_from}. rewords: the same underlying want said in other words, with nothing new at stake. Judge by what {tie_from} wants from {tie_to}, and let the choice of words fall away. When the want underneath is the same and nothing has been added to it, answer rewords."
edge_answer: "Reply with a JSON object with two keys. reason: one short sentence that says what {tie_from} wanted before, what {tie_from} wants now, and why that is the move you chose. move: escalates, reverses, complicates, resolves or rewords. Write reason in English and keep every name exactly as it is written above."

# ---- The pressure -----------------------------------------------------------------------------------------------------------
# One rule or object of the world was asked to act on a chapter. This judge only records whether it did; no flow acts on the verdict.
pressure_role: "You are a careful reader of a story that is written one chapter at a time. You decide whether one {kind} of the world did real work in a chapter, or was only there."
pressure_element_line: "The {kind} in question: {element}"
pressure_aim_line: "The protagonist's aim in the chapter: {aim}"
pressure_plan_lead: "The plan for the chapter:"
pressure_happened_lead: "What happened in the chapter:"
pressure_effects: "Sort what you read into one verdict. acts: the {kind} changes what a character can do, forces a character to choose, or costs a character something. decor: the {kind} is only present: it is named in passing, used as a backdrop, or spoken of with no consequence for anyone. unclear: the text does not say enough to tell. Judge by what the {kind} does to the people in the story, and let how often it is named fall away. When the {kind} could be taken out and nothing in the text would change, answer decor."
pressure_answer: "Reply with a JSON object with two keys. reason: one short sentence that says what the {kind} does in the text, or that it does nothing. effect: acts, decor or unclear. Write reason in English and keep every name exactly as it is written above."

# ---- The lines a flow can show a model that has to try again ---------------------------------------------------------------
# problem_line builds one line from the judge's own reason. The reason comes first, then what to do.
problems:
  edge: "{reason} Let the edge move: show what the person now wants that is new, by making the want stronger, turning it around, adding a second want or a fear, or letting it be met or given up."
  edge_bare: "The edge only repeats what it was in other words. Let the edge move: show what the person now wants that is new, by making the want stronger, turning it around, adding a second want or a fear, or letting it be met or given up."
# When the edge flow sends the shifts back once, this opens the line it adds (resend_line), ahead of the problem line above.
resend:
  edge: "Your first list of changes was set aside."
