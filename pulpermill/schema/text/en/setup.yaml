# English text for the Setup card. Keys match schema/setup.py.
# The protagonist is shown by name, never by id.
card:
  label: "Setup"
  summary: "The springboard: who we follow, what just broke their normal, and what pushes them forward. It holds no plan and no ending, and it never changes during the story."
groups:
  opening: {label: "Opening", help: "Who we follow and what just broke."}
  push: {label: "Push", help: "What pushes them forward, and why they can't stop."}
fields:
  protagonist:
    label: "Protagonist"
    help: "Whose eyes we follow. Exactly one, fixed for the whole story. This is the only place a character is marked as the lead."
    placeholder: "Choose the lead character"
    why: "The model narrates from this person's point of view, in the person and tense you set in Style."
    no_options: "No characters yet. Add your lead in Characters first."
    lead_in: "The story follows {value}."
  normal:
    label: "Normal"
    help: "An ordinary day for the protagonist before the story, drawn from World's everyday life. Say what that normal gave them (safety, status, a routine that kept a want or fear quiet), so the disruption has something to threaten. Only the first chapter uses this; later chapters carry it forward through what happened."
    placeholder: "e.g. Ines opens the print shop at six, sweeps, and does the neighbours' books. The routine keeps her safe, and keeps her from asking about her father."
    why: "Gives the disruption something to break."
    examples:
      good: ["Opens the print shop at six and does the neighbours' books; the routine keeps her safe and keeps her from asking about her father"]
      avoid: ["a normal, happy life", "she was bored"]
    lead_in: "Before the story, the protagonist's ordinary life: {value}"
  disruption:
    label: "Disruption"
    help: "What just broke the normal. An event, not a condition: 'the ledger went missing', not 'things are tense'. Only the first chapter uses this."
    placeholder: "e.g. A customer leaves a ledger on the counter and never comes back."
    why: "Chapter 1 opens on something that has already happened, so the model has a spark to start from."
    examples:
      good: ["The ledger went missing", "A stranger arrives carrying a letter in her mother's hand"]
      avoid: ["things are tense", "her life falls apart"]
    lead_in: "What just broke that normal: {value}"
  goal:
    label: "Goal"
    help: "What the protagonist is concretely trying to do, narrowing one of their wants into this story. It can be acted on in scenes, a reader could tell whether it succeeded, failed or stopped mattering, and it costs something. During the story the current goal is worked out from this and from any redefinitions in the beats; once it is achieved or abandoned the story winds down."
    placeholder: "e.g. Get the ledger back before Friday's audit."
    why: "Every chapter's plan is checked against this, so make it something you can watch happen."
    examples:
      good: ["Get the ledger back before the audit", "Win the apprenticeship before the guild votes"]
      avoid: ["find peace", "become a better person"]
    lead_in: "The protagonist is now trying to: {value}"
  stakes:
    label: "What's at stake"
    help: "What happens if they do nothing or quit. This is why they can't walk away. Tie it to a want, a value or a pressure already on the cards. It can be a friendship, a reputation or a chance at happiness, not only a loss."
    placeholder: "e.g. If the audit finds the books short, she loses the shop and the neighbours who trust her."
    why: "This is what keeps the protagonist from walking away when the goal gets hard."
    examples:
      good: ["She loses the shop her mother left her", "Her brother never forgives her"]
      avoid: ["bad things happen", "everything is lost"]
    lead_in: "If the protagonist does nothing or quits: {value}"
  chapter_count:
    label: "Chapter count"
    help: "A budget, not a fixed route. If the goal resolves early, the remaining chapters carry the aftermath."
    placeholder: "e.g. 12"
    why: "The model plans toward this number and knows when it is writing the last chapter."
    lead_in: "The story runs for {value} chapters."
rules:
  protagonist_link_broken:
    message: "The protagonist no longer exists in Characters."
    fix: "Pick a character."
  normal_is_concrete:
    message: "This doesn't name concrete people, places or routines, or what that normal gave the protagonist."
    fix: "Describe an ordinary day, and what it gave them: safety, status, or a routine that kept a want or fear quiet."
    judge_prompt: "Does this text describe a concrete ordinary day with specific routines, people or places, and say what that normal gave the protagonist? Answer yes or no. If no, suggest a rewrite."
  disruption_is_event:
    message: "This describes a condition, not an event."
    fix: "Say what happened, like 'the ledger went missing', not 'things are tense'."
    judge_prompt: "Does this text describe something that happened, an event, rather than a standing condition? Answer yes or no. If no, suggest a rewrite as an event."
  goal_is_action:
    message: "This reads like a feeling or a theme, not something to act on."
    fix: "Say what they are concretely trying to do, like 'get the ledger back before the audit'."
    judge_prompt: "Is this something a person can act on in scenes, such as getting, finding, stopping or reaching something? Answer yes or no. If no, suggest a rewrite as an action."
  goal_checkable:
    message: "A reader couldn't tell whether this succeeded, failed or stopped mattering."
    fix: "Make it something with a clear outcome."
    judge_prompt: "Could a reader tell whether this goal succeeded, failed or stopped mattering? Answer yes or no. If no, suggest a sharper version."
  goal_touches_cards:
    message: "This goal doesn't connect to anything on the other cards."
    fix: "Narrow one of the protagonist's wants into it, or add a pressure or tie that bears on it. A goal that touches nothing has nothing to collide with."
    judge_prompt: "Does this goal narrow one of the protagonist's wants, and bear on at least one pressure or tie? Answer yes or no for each. If no, suggest the closest connection, or a new pressure for the writer to accept or reject."
  stakes_has_cost:
    message: "This doesn't name a cost or a gain."
    fix: "Say what is lost or gained if they do nothing or quit. It can be a friendship, a reputation or a chance at happiness."
    judge_prompt: "Does this text name something the protagonist would lose or miss out on if they did nothing or quit? Answer yes or no. If no, suggest one."
  stakes_tie_to_cards:
    message: "This isn't tied to a want, value or pressure already on the cards."
    fix: "Tie it to something the protagonist wants or protects, or to a pressure."
    judge_prompt: "Does this text tie to one of the protagonist's wants or values, or to a pressure? Answer yes or no. If no, suggest the closest tie."
