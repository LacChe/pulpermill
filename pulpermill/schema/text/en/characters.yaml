# English text for the Characters card. Keys match schema/characters.py.
# label, help, summary -> human only. expand, lead_in, item_template -> the only text the model sees.
# Templates may use {name} (this character's name), {value}, {items}.
card:
  label: "Character"
  summary: "One individual: who they are, what they want, how they contradict themselves and behave under pressure. It names no other people, places or objects, so it can move between projects."
groups:
  identity: {label: "Identity", help: "The facts the story must never change, plus a short sketch."}
  drive: {label: "Drive", help: "What they want and what they avoid."}
  inner_conflict: {label: "Inner conflict", help: "What gets in their own way, and what they will not betray."}
  texture: {label: "Texture", help: "Skills, soft spots and how they talk."}
  past: {label: "Past", help: "Formative background."}
fields:
  name:
    label: "Name"
    help: "What the narration calls them."
    placeholder: "e.g. Ines Calder"
    why: "Every chapter calls them this, so pick a name you won't want to change."
    lead_in: "The character's name is {value}."
  age:
    label: "Age"
    help: "A concrete number, so the story never drifts."
    placeholder: "e.g. 34"
    why: "A fixed number stops the story drifting, like a 30-year-old slowly becoming 'young'."
    lead_in: "{name} is {value} years old."
  sex:
    label: "Sex"
    help: "Fixes pronouns and avoids contradictions."
    why: "Sets the pronouns used in every chapter."
    options:
      female: {label: "Female", expand: "{name} is a woman, referred to as she and her.", description: "She / her"}
      male: {label: "Male", expand: "{name} is a man, referred to as he and him.", description: "He / him"}
      other: {label: "Other", expand: "{name} is referred to as they and them.", description: "They / them"}
  appearance:
    label: "Appearance"
    help: "Concrete, checkable details: build, hair, face, distinguishing marks, usual dress. State facts, not impressions."
    placeholder: "e.g. Tall and thin, close-cropped grey hair, a burn scar across the left wrist, always in a canvas work coat."
    why: "If a detail isn't here, the model may invent a different one in a later chapter."
    examples:
      good: ["Tall and thin, close-cropped grey hair, a burn scar across the left wrist"]
      avoid: ["striking", "looks dangerous"]
    lead_in: "{name}'s appearance: {value}"
  sketch:
    label: "Sketch"
    help: "One or two sentences on what this person is like. Describe the person, not just a role, and if you can, include one contradiction that doesn't fit the type (a brutal enforcer who keeps bees)."
    placeholder: "e.g. A soft-spoken forger who talks to her plants when she thinks she is alone."
    why: "The quickest way to give the model a person instead of a type."
    examples:
      good: ["A brutal enforcer who keeps bees", "A soft-spoken forger who talks to her plants when she thinks she is alone"]
      avoid: ["a thief", "the detective"]
  wants:
    label: "Wants"
    help: "Two to five abstract desires that can't all be satisfied at once (succeed at school, be left alone). Nothing concrete and nobody else: aims toward a particular person live in Entanglements. The conflict between them is what drives the character."
    why: "Wants that pull against each other are what force this character to choose and struggle."
    empty: "No wants yet. Add at least two that pull against each other."
    add: "Add a want"
    delete_confirm: "Delete this want?"
    item_title: "{text}"
    lead_in: "{name} wants several things that cannot all be satisfied at once: {items}."
    item_template: "{text}"
    item_join: "; "
    item_fields:
      text: {label: "Want", help: "One desire, in a few words.", placeholder: "e.g. be left alone", examples: {good: ["be left alone", "succeed at school", "be admired"], avoid: ["get revenge on his brother", "find the missing necklace"]}}
  fear:
    label: "Fear"
    help: "What they avoid or protect themselves from."
    placeholder: "e.g. Being relied on, then failing the person who relied on them."
    why: "Fear shows up as what the character avoids, which is easier to write than a feeling."
    lead_in: "{name} avoids and protects themselves from: {value}"
  flaw:
    label: "Flaw"
    help: "A false belief or blind spot that sabotages what they want."
    placeholder: "e.g. Believes asking for help creates a debt that can never be repaid."
    why: "A flaw that works against the wants is what turns events into character."
    lead_in: "{name} holds a false belief or blind spot that sabotages what they want: {value}"
  values:
    label: "Values"
    help: "What they hold sacred or will not betray, phrased positively ('keeps their word even when it ruins them')."
    why: "Values give the character something to lose and lines they won't cross."
    empty: "No values yet. What would this person never betray?"
    add: "Add a value"
    delete_confirm: "Delete this value?"
    item_title: "{text}"
    lead_in: "{name} holds sacred, and keeps faith with: {items}."
    item_template: "{text}"
    item_join: "; "
    item_fields:
      text: {label: "Value", help: "One thing they protect, phrased positively.", placeholder: "e.g. keeps their word even when it ruins them", examples: {good: ["keeps their word even when it ruins them"], avoid: ["never lies", "doesn't hurt innocents"]}}
  behaviors:
    label: "Behaviors"
    help: "How they act in different inner states. Include at least one calm or happy state."
    why: "Gives the model a person who acts differently as they feel differently, not one fixed mood."
    empty: "No behaviors yet. Start with how they act when they feel at ease."
    add: "Add a behavior"
    delete_confirm: "Delete this behavior?"
    item_title: "when {state}, they {tendency}"
    lead_in: "{name} has these dispositions: {items}."
    item_template: "when {state}, they {tendency}"
    item_join: "; "
    item_fields:
      state: {label: "When", help: "An inner or broad social state, like 'feels watched', 'is being praised' or 'is out of their depth'. Not a specific situation.", placeholder: "e.g. feels watched", examples: {good: ["feels watched", "is being praised", "is out of their depth"], avoid: ["is in a bar fight", "the police arrive"]}}
      tendency: {label: "They", help: "A leaning or habit, like 'go quiet' or 'busy their hands'. Not one particular act.", placeholder: "e.g. go quiet and busy their hands", examples: {good: ["go quiet", "busy their hands"], avoid: ["punch the nearest wall", "leave through the window"]}}
  competence:
    label: "Competence"
    help: "What they're good at."
    placeholder: "e.g. Reads people's tells; can fix almost any mechanism."
    why: "Knowing what they are good at lets the story reward them."
    lead_in: "{name} is good at: {value}"
  vulnerability:
    label: "Vulnerability"
    help: "Where they can be hurt or caught out, including shame that shapes behavior."
    placeholder: "e.g. Ashamed of never finishing school; cannot bear being laughed at."
    why: "Gives other characters, and the plot, something to press on."
    lead_in: "{name} can be hurt or caught out by: {value}"
  speech:
    label: "Speech"
    help: "How they talk: rhythm, vocabulary, what they never say."
    placeholder: "e.g. Short, dry sentences; never says sorry."
    why: "Lets dialogue sound like this person and not like the narrator."
    lead_in: "{name} speaks like this: {value}"
  history:
    label: "History"
    help: "Short, formative background that explains the flaw and the wants. No named people, places or objects from any story."
    placeholder: "e.g. Raised in a boarding house where nothing was ever hers to keep."
    why: "Explains the flaw and the wants. Keep it short or it crowds the page."
    examples:
      good: ["Raised in a boarding house where nothing was ever hers to keep"]
      avoid: ["Her brother Tom left after the fire in Marlow"]
    lead_in: "Formative background: {value}"
rules:
  char_other_names:
    message: "This mentions {names}. A character has to work in any project, so it should not name other people, places or objects."
    fix: "Rephrase as a trait (for example 'distrusts family'). Ties go in Entanglements and shared history in World."
  char_no_relationships:
    message: "This describes a relationship to someone else. A character has to stand alone."
    fix: "Rephrase as a trait of this person, like 'distrusts family'. Ties between people are recorded in Entanglements."
    judge_prompt: "Does this text name a particular person in the character's life (a sibling, partner, boss or friend), rather than a feeling or habit about people in general such as 'feels overlooked' or 'distrusts family'? Answer yes or no. If yes, rewrite it as a trait of this person alone."
  sketch_describes_person:
    message: "This reads as a role, not a person."
    fix: "Say what this person is like. A role gives the model a stereotype to fall back on."
    judge_prompt: "Does this sketch describe what the person is like, beyond naming a role or occupation? Answer yes or no. If no, suggest a rewrite that describes the person."
  appearance_concrete:
    message: "This gives impressions. Appearance works best as concrete details."
    fix: "List what could be checked: build, hair, face, marks, usual dress."
    judge_prompt: "Does this text give concrete, checkable details of appearance, with impressions kept to a minimum? Answer yes or no. If no, suggest a rewrite as concrete details."
  wants_count:
    message: "Wants needs at least two items so they can pull against each other."
    fix: "Add a second want that pulls against the first."
  wants_conflict:
    message: "These wants don't clearly pull against each other."
    fix: "Add a want that conflicts with the others. A suggestion can be offered for you to accept or reject."
    judge_prompt: "Does pursuing this want make at least one of the other wants harder to pursue, because they compete for the character's time, effort, safety or loyalty? Answer yes or no. If no for every want, propose one opposing want that cannot be satisfied alongside the others."
  values_positive:
    message: "A value reads as a rule against something."
    fix: "Phrase it as what they protect, like 'keeps their word even when it ruins them'."
    judge_prompt: "Is each value phrased as something the character protects or keeps faith with? Answer yes or no for each. Rewrite any that fail."
  behavior_state_is_inner:
    message: "A 'When' box describes a specific situation."
    fix: "Use an inner or broad social state, like 'feels watched' or 'is being praised'."
    judge_prompt: "Is each 'when' an inner or broad social state rather than a specific situation? Answer yes or no for each. Rewrite any that fail."
  behaviors_include_calm:
    message: "Every state is stressful. Add a calm or happy one."
    fix: "Add a state like 'feels at ease' or 'is among people they trust'."
    judge_prompt: "Is the 'when' of this item a calm or happy state, as opposed to a stressful one? Answer yes or no. If no for every item, suggest a calm or happy state to add."
  behavior_is_tendency:
    message: "A 'They' box describes one specific act."
    fix: "Use a habit or leaning, so a fresh version can be written each time."
    judge_prompt: "Is each 'they' a tendency or habit rather than one specific act? Answer yes or no for each. Rewrite any that fail."
