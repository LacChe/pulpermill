# English text for the Outline card. Keys match schema/outline.py.
# Links (place, cast, tie) are shown by name, never by id.
card:
  label: "Outline"
  summary: "One springboard beat per chapter, planned one at a time from where the story stands. A beat is frozen while its chapter is written, and you can see the next chapter's plan before generating it."
groups:
  beats: {label: "Beats", help: "One per chapter."}
fields:
  beats:
    label: "Beats"
    help: "Each beat sets up a chapter: where it opens, who is on stage, the tie in the spotlight, what the protagonist is after, and the plan the writer follows. The aim and the spotlight tie are what the chapter makes collide; how the meeting goes is for the chapter to decide."
    empty: "No beats yet. Choose a cast and press Plan, or add one by hand."
    add: "Add a beat"
    delete_confirm: "Delete this beat?"
    item_title: "Chapter {chapter}"
    # TODO prompt design: placeholder lead-in and item template.
    lead_in: "Chapter beats:\n{items}"
    item_template: "Chapter {chapter}. We open at {where}, {when_time}. Present: {cast}. Spotlight: {spotlight}. The protagonist is after {aim}. Plan: {plan}"
    item_join: "\n"
    item_fields:
      chapter: {label: "Chapter", help: "Which chapter this beat is for. Set by the system.", placeholder: "Set by the system"}
      stale: {label: "May no longer fit", help: "Set when an earlier chapter was regenerated after this beat was planned, so this beat, its chapter and its records may be out of step. Cleared when the chapter is generated again."}
      where: {label: "Where", help: "Where the chapter opens. A place from World.", placeholder: "Choose where it opens", why: "Anchors the opening in a place you defined, so the model doesn't invent one.", no_options: "No places yet. Add some in World first."}
      when_time: {label: "When", help: "The day and time the chapter opens. The scene is already in motion.", placeholder: "e.g. Tuesday, just after the shop opens", why: "The model starts mid-scene at this moment, and later plans read these times as a timeline."}
      cast: {label: "Cast", help: "Who is on stage. You pick it before planning. The protagonist and both characters of the spotlight tie must be included.", placeholder: "Choose who is on stage (up to 5)", why: "Only these characters appear in the chapter. Anyone else can be mentioned or thought of, but doesn't show up.", no_options: "No characters yet. Add some in Characters first."}
      spotlight: {label: "Spotlight", help: "The tie this chapter is about: its two characters and their relationship. The system picks one at random, and you can change it. Both characters must be in the cast.", placeholder: "Choose a tie", why: "Gives the chapter a relationship to work on, and spreads the story across the ties instead of one thread taking over.", no_options: "No ties yet. Add some in Entanglements first."}
      aim: {label: "What the protagonist is after", help: "What the protagonist is trying to get or do in this chapter. The planner writes it each chapter, so that it runs into the spotlight tie. The writer plays the meeting between the two.", placeholder: "e.g. Get the guild clerk to sign the permit before the auditor arrives", why: "Gives the chapter its engine: something the protagonist is going after, and a tie it meets.", examples: {"good": ["Get the guild clerk to sign the permit before the auditor arrives", "Reach the cellar before the board's clerk does"], "avoid": ["Feel better about her father", "Figure out her life"]}}
      plan: {label: "Plan", help: "The planner's plan for this chapter: what happens, and in what order. The writer sees it. You can edit it before generating.", placeholder: "Written by the planner", why: "This is what the writer follows, so change it if the chapter should go differently."}
      planned_from: {label: "Planned from", help: "A fingerprint of what this beat was planned from. Set by the system. If that changes afterward, the beat is flagged as planned from older state.", placeholder: "Set when the beat is planned"}
rules:
  outline_link_broken:
    message: "A beat points to something that no longer exists."
    fix: "Pick a replacement, or ask for the beat to be regenerated."
  cast_has_protagonist:
    message: "The cast doesn't include the protagonist."
    fix: "Add the protagonist. They are in every chapter."
  spotlight_pair_in_cast:
    message: "A character in the spotlight tie is not in the cast."
    fix: "Add both characters of the tie to the cast, or pick a different spotlight tie."
  aim_not_repeated:
    message: "This aim is too close to an earlier one."
    fix: "Aim at a different step, or at what the last chapter changed."
