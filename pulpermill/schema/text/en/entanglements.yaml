# English text for the Entanglements card. Keys match schema/entanglements.py.
# In templates, link fields (people, things, places, rules) are shown by name, never by id.
card:
  label: "Entanglements"
  summary: "The live connections in this story: ties between people, who holds what, who knows what, and what is pressing on them. It changes as the story moves."
groups:
  ties: {label: "Ties", help: "Directed connections between people and groups."}
  holdings: {label: "Holdings", help: "Who holds or controls which thing or place."}
  knowledge: {label: "Knowledge", help: "Who knows, suspects or has been misled about a fact."}
  pressures: {label: "Pressures", help: "Circumstances and agents pushing on the story."}
fields:
  ties:
    label: "Ties"
    help: "How people and groups are connected. A tie points one way: how 'from' stands toward 'to'."
    why: "Ties tell the model how people stand toward each other before anyone speaks."
    empty: "No ties yet. Add how two people or groups are connected."
    add: "Add a tie"
    delete_confirm: "Delete this tie?"
    item_title: "{tie_from} → {tie_to}"
    lead_in: "Ties between people and groups:\n{items}"
    item_template: "{tie_from} toward {tie_to}: {bond}. Right now, {edge}"
    item_join: "\n"
    item_fields:
      tie_from: {label: "From", help: "A character or a group.", placeholder: "Choose a character or group", no_options: "No characters or groups yet. Add some in Characters or World first.", disabled_reason: "Already the other end of this tie. A tie can't point at itself."}
      tie_to: {label: "To", help: "A character or a group.", placeholder: "Choose a character or group", no_options: "No characters or groups yet. Add some in Characters or World first.", disabled_reason: "Already the other end of this tie. A tie can't point at itself."}
      bond: {label: "Bond", help: "A standing label for the connection, which may carry a clause of shared past ('owes her since the fire').", placeholder: "e.g. owes her since the fire", examples: {good: ["owes her since the fire", "rivals since school"], avoid: ["wants to pass her test"]}}
      edge: {label: "Edge", help: "A concrete aim between these two people right now: what 'from' wants from, or hides from, 'to' (wants to pass her test, hides the missing key). Abstract desires belong on the character.", placeholder: "e.g. hides the missing key", why: "The edge is what makes a tie do something in this chapter.", examples: {good: ["wants to pass her test", "hides the missing key"], avoid: ["resents her", "they are close"]}}
  holdings:
    label: "Holdings"
    help: "Who holds or controls which thing or place. Moves as things change hands."
    why: "Who holds what moves the plot: things change hands and places get controlled."
    empty: "No holdings yet. Add who holds or controls a thing or place."
    add: "Add a holding"
    delete_confirm: "Delete this holding?"
    item_title: "{held_by} holds {holdee}"
    lead_in: "Who holds or controls what:\n{items}"
    item_template: "{held_by} holds or controls {holdee}"
    item_join: "\n"
    item_fields:
      holdee: {label: "Thing or place", help: "A thing or a place from World.", placeholder: "Choose a thing or place", no_options: "No things or places yet. Add some in World first."}
      held_by: {label: "Held by", help: "Who holds it now. The choices depend on what it is.", placeholder: "Choose who holds it", why: "Moves as things change hands, and the model updates it after each chapter.", no_options: "Nobody can hold this yet. Add characters, groups or places first.", filtered_note: "Only holders that make sense for this kind of thing are listed."}
  knowledge:
    label: "Knowledge"
    help: "One thing, and what each person or group stands towards it: who knows it, who suspects it, who has been misled about it. It is measured against what is true in the story, which cannot be wrong. Someone who is simply unaware is left out."
    why: "A secret only matters if someone can act on what they know, or fail to."
    empty: "No knowledge entries yet. Add something, and who knows, suspects or was misled about it."
    add: "Add what people know"
    delete_confirm: "Delete this entry?"
    item_title: "{rule}{fact}"
    one_of:
      - {fields: [rule, fact], label: "This is about", options: {rule: "A rule of the world", fact: "Something else"}}
    lead_in: "What each person can and cannot act on, given what they know:\n{items}"
    item_template: "{rule}{fact}. Knows: {knows}. Suspects: {suspects}. Misled: {misled}"
    item_join: "\n"
    item_fields:
      rule: {label: "World rule", help: "A rule from World this is about.", placeholder: "Choose a rule from World", no_options: "No rules yet. Add some in World first."}
      fact: {label: "Other fact", help: "Or a short fact of your own, when it isn't a world rule.", placeholder: "e.g. The key is hidden in the well"}
      knows: {label: "Knows it", help: "Has the true story: knows the key is in the well. Characters or groups; someone is in only one of the three lists.", placeholder: "Choose who knows it", no_options: "No characters or groups yet. Add some in Characters or World first."}
      suspects: {label: "Suspects it", help: "Has a hunch and could act on it, but isn't sure: suspects the key is in the well.", placeholder: "Choose who suspects it", no_options: "No characters or groups yet. Add some in Characters or World first."}
      misled: {label: "Misled about it", help: "Believes something false: thinks the key is in the attic.", placeholder: "Choose who is misled", no_options: "No characters or groups yet. Add some in Characters or World first."}
      belief: {label: "What they believe instead", help: "Only when someone is misled about something true: the false thing they take to be true instead. Leave it empty for a Myth, where the Myth itself is what they believe.", placeholder: "e.g. The key is in the attic", visible_if: {misled: "filled"}}
  pressures:
    label: "Pressures"
    help: "What is pressing on people, from a circumstance or from someone with their own wants."
    why: "Pressure is what gets the next chapter moving. Three or fewer at once keeps each one felt."
    empty: "No pressures yet. Add what is pushing on people right now."
    add: "Add a pressure"
    delete_confirm: "Delete this pressure?"
    item_title: "{what}"
    one_of:
      - {fields: [source_agent, source_circumstance], label: "Pushed by", options: {source_agent: "Someone", source_circumstance: "A circumstance"}}
    lead_in: "Pressures on the story:\n{items}"
    item_template: "{what} (from {source_agent}{source_circumstance}; bears on {bears_on}). Next move: {next_move}"
    item_join: "\n"
    item_fields:
      what: {label: "What", help: "What is pressing, and what happens if it is ignored.", placeholder: "e.g. The Guild audits the wells by month's end, and any well found short is shut down.", examples: {good: ["The Guild audits the wells by month's end, and any well found short is shut down"], avoid: ["tension is rising"]}}
      source_agent: {label: "Agent", help: "A character or group behind it.", placeholder: "Choose a character or group", no_options: "No characters or groups yet. Add some in Characters or World first."}
      source_circumstance: {label: "Circumstance", help: "Or a circumstance with no one behind it, like a storm or a deadline.", placeholder: "e.g. a drought, or a deadline"}
      next_move: {label: "Agent's next move", help: "Only when an agent is behind it: what they want in this situation, not their general wants.", placeholder: "e.g. Plans to call in the loan before the audit", examples: {good: ["Plans to call in the loan before the audit"], avoid: ["Wants power", "Wants to be loved"]}, visible_if: {source_agent: "filled"}}
      bears_on: {label: "Bears on", help: "Who it falls on: characters or groups.", placeholder: "Choose who it falls on", no_options: "No characters or groups yet. Add some in Characters or World first."}
      status:
        label: "Status"
        help: "A pressure is active until its next move has happened in a written chapter. The system marks it resolved then, and later chapters stop planning around it. You can change it."
        why: "Keeps a pressure that has played out from taking the spotlight again."
        options:
          active: {label: "Active", expand: "still pressing", description: "The Guild has not yet closed the wells."}
          resolved: {label: "Resolved", expand: "has played out", description: "The Guild closed the wells, and the story has moved on from it."}
rules:
  tie_not_self:
    message: "A tie goes from someone to themselves."
    fix: "Pick a different person or group for one end."
  holding_pair_allowed:
    message: "That holder isn't allowed for this kind of thing."
    fix: "Pick a holder from the list offered for it."
  knowledge_someone:
    message: "No one is listed as knowing, suspecting or being misled."
    fix: "Add at least one person or group to one of the three lists."
  knowledge_one_standing:
    message: "Someone is in more than one of the lists."
    fix: "Keep each person or group in only one of knows, suspects and misled."
  knowledge_one_fact:
    message: "Give either a world rule or a fact of your own, not both or neither."
    fix: "Fill in one of the two."
  pressure_one_source:
    message: "Give either an agent or a circumstance, not both or neither."
    fix: "Fill in one of the two."
  next_move_for_agents:
    message: "A pressure with an agent needs the agent's next move."
    fix: "Say what the agent wants to do next in this situation."
  link_broken:
    message: "This points to something that no longer exists."
    fix: "Pick a replacement, or remove the entry."
  tie_edge_is_live:
    message: "This edge doesn't say what one side wants from, or hides from, the other right now."
    fix: "Say what 'from' is after or keeping back, not just how they feel."
    judge_prompt: "For each tie, does the edge say what one side wants from, or hides from, the other right now? Answer yes or no for each. Rewrite any that fail."
  pressure_has_consequence:
    message: "A pressure doesn't say what happens if it's ignored."
    fix: "Add the cost of doing nothing."
    judge_prompt: "For each pressure, does the text say what happens if it is ignored? Answer yes or no for each. Suggest a consequence for any that fail."
  pressure_next_move_in_situation:
    message: "A next move reads as the agent's general wants."
    fix: "Say what they want to do in this situation."
    judge_prompt: "For each agent's next move, does it describe what the agent wants in this situation, not their wants in general? Answer yes or no for each. Rewrite any that fail."
  pressures_active_count:
    message: "More than three pressures are active."
    fix: "Let the weakest one fade or end, so the others get room."
