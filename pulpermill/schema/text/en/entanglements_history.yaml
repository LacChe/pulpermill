# English text for the Entanglements history record. Pipeline-only: hidden from the user and never sent to the model.
card:
  label: "Entanglements history"
  summary: "Entanglements as each chapter was written from: the values on screen when generate was pressed. Lets a chapter be redone from the state it started with, and an unfinished story resume."
groups:
  entries: {label: "Snapshots", help: "One per chapter."}
fields:
  states:
    label: "Snapshots"
    help: "One whole copy of Entanglements per chapter, taken when the chapter is generated."
    item_fields:
      beat: {label: "Chapter", help: "Which chapter was written from this state, shown as its number."}
      state: {label: "State", help: "The whole Entanglements card as that chapter started."}
rules:
  history_beat_unique:
    message: "Two snapshots are for the same chapter."
    fix: "Keep one snapshot per chapter."
