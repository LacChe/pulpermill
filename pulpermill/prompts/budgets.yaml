# Token budgets (phase 5). Everything is counted on the Gemma 3 tokenizer, with the chat template around the prompt.
# n_ctx is the context the backend loads the model with; the Kaggle T4x2 holds the Q6 27B weights (~22 GB of its 30 GB), so the
# rest is the key-value cache: Gemma 3 27B needs about 0.25 MB of cache per token (62 layers x 8 key-value heads x 128 x 2 x 2 bytes),
# so 12,288 tokens is ~3 GB. That is an estimate, not a measurement: Part B checks it on the real machine. Change n_ctx here when the backend is tried on real hardware, and the tests and the report follow.
n_ctx: 12288
# Tokens kept free after the prompt and the reply: the template's own tokens, a changed tokenizer, a longer word list.
margin: 300
# The most each call may write (max_tokens in the backend). Prose is ~1.35 tokens a word: a 750-word section is ~1,000 tokens.
max_output:
  writer: 1600           # one section of ~750 words, with room to finish its last sentence
  planner_think: 1200
  planner_beat: 900
  events: 900
  shifts: 1000
  fill: 1000
  judge: 500
  style_fit: 400
  offstage: 400
  end_story: 1800
# The chapter text an Events or Shifts prompt carries. The target is 3,000 words; a long chapter (an extra section) is ~4,000.
chapter_words_worst_case: 4000
