# The chapter writer (W). One call per section of the chapter. Drafted in docs/prompts/02-writers-brief.md, sections 2.1 to 2.9.
# The material between the rules and the section's job is rendered by pulpermill/prompts/blocks.py (writer_blocks).
# Tokens in {braces} are filled by pulpermill/prompts/prompts.py. Every line says what to do.
name: writer
version: "writer-0.1"

rules: |
  {language_line}
  {voice_rules}
  Keep person, tense and distance the same from the first line to the last, including inside dialogue tags and in the middle of an action scene.

craft: |
  You are writing one chapter of a novel. A chapter is a scene, not a summary: someone wants something, something stands in the way, they have to choose, and by the end something is different.

  Start inside the moment, at the place and time given, with the scene already moving. Stay in the scene: show what people do, say and notice, in the order it happens, and let the reader work out what it means.

  People act from who they are. Let a want, a fear or a flaw show up as a choice the person makes, a thing they say, or a thing they cannot bring themselves to do. Each person on stage speaks in their own way.

  Give the reader concrete things: a sound, an object in someone's hands, the weight of a door, the exact words of a line. One precise detail does more than three general ones.

  Let the scene take the time it needs. When the moment matters, slow down and play it out beat by beat; when it does not, move on in a sentence.

  End where the scene ends, on a moment that leaves a question open.

# What each section of the chapter is for. The beat's own details are filled in.
jobs:
  open: "Open inside the scene at {where}, with the scene already moving. Show what {protagonist} is after, and let the first sign of what stands in the way appear."
  open_press: "Open inside the scene at {where}, with the scene already moving. Show what {protagonist} is after, meet what stands in the way, and let the pressure build as the first attempts cost something.{plant_hint}{reveal_hint}"
  press: "Press on the obstacle: each attempt by {protagonist} costs something, and things get harder.{plant_hint}{reveal_hint}"
  choice: "Force the choice between the two options the scene set up, and play it out with its cost.{payoff_hint}"
  close: "Show what is different now, and bring the scene to its ending moment.{late_hint}"

# Added to a job only when the beat names the thing.
hints:
  plant: " Set up this, in passing and if it fits: {plant}"
  reveal: " If it fits, bring the hidden truth to light here, in one clear moment."
  payoff: " If it fits, pay off what was set up earlier here: {payoff}"
  late: " Anything the beat names that has not happened on the page yet (the hidden truth, the set-up, the pay-off) happens now, briefly."

job: |
  This is section {k} of {n} of the chapter, about {words} words.
  Its job: {job}
  {tail}
tail_middle: "The scene is not over after this section. Stay in the moment: end the section mid-scene, on a line or an action, so the next section can pick up from it."
tail_last: "This is the last section: bring the scene to its ending moment and stop there."

# Inserted before the last section when the chapter is running short.
extra: |
  This is an extra section, about {words} words, placed before the chapter's close.
  Its job: the scene is not over. Stay in it and take it further: let {protagonist} try something else, let someone say what they have been holding back, or let the obstacle show a new side.
  End the section mid-scene, on a line or an action, so the next section can pick up from it.

so_far_lead: "The chapter so far (its last part):"
so_far_tail: "Continue from the end of this passage, in the same voice."

reminder: |
  Write in {voice}, the whole way through. Stay in the scene.{fresh}
  {ending_line}
  Reply with the story text itself, beginning at its first word.
fresh: " The images and gestures in the passage above are already used, so reach for new ones."
ending_middle: "End this section mid-scene, and leave the chapter's ending moment for the last section."
ending_last: "Stop on the ending moment."

languages:
  en: "English"
  zh-Hans: "Simplified Chinese"
  zh-Hant: "Traditional Chinese"
  ja: "Japanese"
  ko: "Korean"
  fr: "French"
  de: "German"
  es: "Spanish"
