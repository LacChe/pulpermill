# Style fit (S): does the protagonist suit the chosen person, tense and voice? The story-start gate.
name: style_fit
version: "style_fit-0.1"

job: |
  A story is about to start, and its voice has been chosen. Decide whether the protagonist can carry a story told this way. A very guarded protagonist is hard to tell in the first person, a very talkative one is hard to tell in a clinical, external voice, and a protagonist with no inner life is hard to tell from deep inside their mind. Judge only the fit between the person and the voice.
  Say whether it fits. When it does not, say in one sentence which part to look at, in {language_name}.

voice_lead: "How the story will be told:"
protagonist_lead: "The protagonist:"
task: "Now say whether the protagonist fits the voice, as the reply format asks."
