# The planner (P): think in free text, then fill the beat. Drafted in docs/prompts/02-writers-brief.md, section 3.
name: planner
version: "planner-0.3"

job: |
  You are planning one chapter of a novel. A chapter is a scene, not a summary: someone wants something, something presses against it, and by the end something is different. A writer will write the chapter from your plan, so make the plan a scene the writer can play, with people who act from who they are.
  Below is everything that is true so far. Plan the next chapter.

# Short lines the planner is given about how to use the numbers the code worked out.
use_of_numbers: |
  Lean towards the places and things that have been used least, when they fit the scene.
  Bring a hidden truth to light when the story is ready for it. In the first third of the story, hold it back unless this chapter's goal depends on it, and let a person come to suspect it before they know it.
  A payoff is a consequence of an open plant: something the plant makes happen, so the plant is changed by it. Telling the plant a second time is not a payoff. A chapter that gives a plant a natural consequence is the one to choose.
  The story stands on a goal, and one pressure is in focus this chapter. Design the chapter at the place where they meet: the protagonist takes a step toward the goal, and the pressure's next move comes at that step. Work out how the meeting could go, because it decides what both become. The goal ends the chapter achieved, taken to a later stage of the same thread, or given up for something that now matters more. The pressure ends the chapter with its next move made and over, or turned into something new (a different next move, a new form, a nearer date). Plan so that the chapter after this one has something to stand on.
  A plant is something new. Leave it out when nothing new needs setting up, and keep clear of anything already listed as open.

arc:
  early: "This is an early chapter: open doors, set up what the story will lean on, and let the protagonist commit."
  middle: "This is a middle chapter: tighten the squeeze, and let what the protagonist chose earlier cost them."
  late: "This is a late chapter: pay off what was set up, and let the story's threads pull together: the stakes, the pressures that are still live and the hooks nobody has answered."
  last: "This is the last chapter. Look through the story so far for what is still open (the stated stakes, the live pressures, the hooks nobody answered, the secrets), choose the one or two threads that carry the most plot, and let this chapter's turn resolve them. Minor threads can rest. Bring the story to its close."

think_steps: |
  Think in these steps, briefly, in plain sentences, about 300 words in all.
  1. Where the story stands: the goal now and how far it has come, the pressure in focus and its next move, and what has changed since the chapter before. In a late or last chapter, list the open threads from the story so far and the live pressures, and choose the one or two that carry the most plot.
  2. Three ways the goal and the pressure could meet in this chapter, one line each. They differ in who drives the scene (the protagonist, the agent of the pressure arriving on stage, someone with a want of their own) and in where the meeting happens. Each sets a specific step toward the goal against the pressure's next move in this world.
  3. Pick one and say why it is fresh. A chapter is fresh when the goal moves or the pressure changes; a new room or new props do not make it so. Say how it picks up the last chapter's closing moment: it answers it, turns it aside on purpose, or promises to pay it off within two chapters.
  4. How the meeting plays out: what the protagonist's step gets and what it costs, what the pressure does in answer, and so what each one becomes by the end. Name where the goal ends up (achieved, a later stage of the same thread, or given up) and where the pressure ends up (its next move made and over, or turned into something new). The chapter after this one needs to be possible from there.
  5. What is different at the end, and the last moment of the chapter.
  6. Whether to plant something for later, give an open plant a consequence, or bring a hidden truth to light, and why now.
  7. How the chapter should be told: one moment worth slowing down on, and one stretch to pass over in a sentence.

your_plan_lead: "Your plan for this chapter:"

beat_guide: |
  Fill the beat from your plan. Write each field as a plain sentence a writer could act on, with the names of people and places.
  - The opening place and time put the scene already in motion.
  - What the protagonist is after is the one step this scene takes toward the goal now. It is something they can act on in scenes, such as getting, finding or stopping something, and it is written so that it already runs into the pressure in focus: the writer plays the meeting from it.
  - The ending is a moment that leaves a question open (in the last chapter, the moment that closes the story). It comes out of how the meeting plays out in your plan.
  - Use a shift from the allowed list and a reveal from the hidden truths still waiting.
  - A payoff is chosen from the open plants.
  - Answer reveal, payoff and plant from your plan. When the plan names none, the right answers are an empty reveal, an empty payoff list and null for the plant. A payoff names an open plant the chapter gives a consequence to. The word "none" is never a plant.
  Reply with the beat only.

retry: |
  Your first plan was refused for these reasons:
  {problems}
  Here is your first plan:
  {thinking}
  {beat}
  Keep what worked, and change only what the reasons say.
