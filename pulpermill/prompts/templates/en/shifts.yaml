# The Shifts and Entanglements extractor (X2): who moved, and what changed in the live entanglements.
# Drafted in docs/prompts/02-writers-brief.md, section 6.
name: shifts
version: "shifts-0.1"

job: |
  Read the chapter below and say who moved. Only people whose belief, fear, want, refusal or decision changed in this chapter count, and only what changed, so compare with where each person stood at the start. At most five people.
  For each person who moved, fill in only the boxes that changed:
  - believes: a conviction they now hold, which the story could prove wrong
  - fears: a fear that is new or different
  - wants: an abstract desire that changed (a concrete aim toward one person belongs on a tie's edge)
  - refuses: something they now will not do
  - decided: what they decided; for the protagonist, say which of the two choices the chapter posed they took, or what they did instead
  Then say what changed in the live entanglements, using the handle given for each item. For each change give only the new words as they should read now, never "old -> new" and never the old words. When someone learns, comes to suspect or is misled about something that already has a line, put them in that line: change it (give the person under knows, suspects or misled) or add a knowledge row that names the line by its handle in entry. Never write out again something that already has a line. Add a knowledge row with the rule or fact written out only for something that has no line yet, one per person; for someone misled, say in belief what they wrongly believe. Say who actually learned the hidden truth, if one came out. When nothing changed, give an empty list.
  Last, list in shown the handles of the pressures, knowledge, ties and holdings that the chapter actually showed: something a person acts on, is held back by, learns, or that changes on the page. A handle whose subject is only named in passing is left out. When none were shown, give an empty list.

people_lead: "The people on stage:"
choice_lead: "The chapter posed this choice for {name}:"
choice_line: "{label}: {value}"
reveal_lead: "The beat planned for this to come to light: {statement} Planned to be learned by: {learners}."
found_lead: "What a first reading of the chapter found:"
found_happened: "What happened: {value}"
found_reveals: "Hidden truths that came to light: {value}"
handles_lead: "The live entanglements, each with its handle:"
may_change:
  ties: "Ties (you may change: bond, edge)"
  holdings: "Holdings (you may change: held_by)"
  knowledge: "Knowledge (you may change: knows, suspects, misled, each given the one person who now stands that way; belief, the false thing a misled person believes)"
  pressures: "Pressures (you may change: what, next_move, bears_on)"
chapter_lead: "The chapter:"
task: "Now say who moved and what changed, as the reply format asks."
