# Card fill (F). A first working prompt: it is tuned later with the card-fill kit (tests/cardfill). Drafted in
# docs/prompts/02-writers-brief.md, section 7. The scope lines come from tests/cardfill/00-test-plan.md.
name: fill
version: "fill-0.2"

job: |
  You are filling in one card of a story-planning tool from the writer's own words. The writer will read and edit every field, so fill what the words support, and write each field the way the field's guide asks.
  Write in {language_name}. Fill a field only when the words give you something for it, and leave the rest out. Name people, places and things by their names. Keep what the writer states exactly: every name, number and detail they give belongs on the card.
  When the writer says people believe something that is not true, or that a rule is only a belief, that rule is a Myth: set its status to the Myth value and write what is really true. When they say someone only suspects something, the status is suspects, not knows. For example, "Mara thinks the harbourmaster is skimming the tolls" is a knowledge line whose subject is the skimming, with Mara under suspects; knows stays empty until the writer says she has proof.

scope:
  style:
    invent: "Everything in Style."
    leave_out: "Names and events that belong to one story."
  characters:
    invent: "The person themselves."
    leave_out: "Other people, places, objects and relationships (they belong to other cards)."
  world:
    invent: "Places, things, groups, rules and terms."
    leave_out: "Characters, who owns what, who knows what, and what a group wants right now."
  entanglements:
    invent: "Ties, holdings, knowledge and pressures among the items that already exist. A pressure may come from a circumstance."
    leave_out: "New groups, places, objects, rules and characters."
  setup:
    invent: "The normal, the disruption, the goal, the stakes and the chapter count."
    leave_out: "A protagonist who is not one of the characters, and new named people, places or objects."
# Extra guidance for one card, added after its scope line.
card_guidance:
  world: |
    Every object the writer's note mentions gets its own entry in objects, under the name the note uses, with what it is and why it matters.
  entanglements: |
    Give the story three pressures, because pressure is what gets chapters moving. Write the ones the writer states, then add the ones that follow from the people and the world: a group that wants something, a secret that could come out, a deadline or circumstance, a want two people cannot both have. Make them different from each other, each with its own agent or circumstance and each falling on different people or groups. Each one says what happens if it is ignored, and an agent's pressure gives that agent's next move in this situation.

scope_line: "This card. You may invent: {invent} Leave out: {leave_out}"

card_lead: "The card is {label}. Its fields:"
other_cards_lead: "The cards this one builds on (link to what is here, by name, and invent nothing new about them):"
names_lead: "Names you may link to:"
current_lead: "The card as it stands now (keep what is already written unless the words say otherwise):"
current_none: "The card is empty so far."
note_lead: "The writer's note for this card:"
chapter_lead: "The example chapter the writer pasted:"
task: "Now fill the card, as the reply format asks."
