# Length caps, in characters, for text that is sent to a model. First guesses: phase 5 replaces them with token budgets
# measured on the Gemma tokenizer. A cap cuts at the last sentence end that keeps most of the text, and the cut is
# recorded in the render report, so a clipped field is never silent.
# Fixed fields (name, age, sex, appearance) are always sent in full and have no cap.
characters:
  sketch: 700
  fear: 450
  flaw: 450
  competence: 450
  vulnerability: 450
  speech: 550
  history: 700
  want_item: 220
  value_item: 220
  behavior_state: 220
  behavior_tendency: 280
  max_behaviors: 5
world:
  name: 120
  era_and_technology: 600
  everyday_life: 700
  history: 700
  place_description: 450
  place_effect: 350
  object_description: 350
  object_significance: 350
  power_nature: 350
  power_hold: 350
  power_felt: 300
  rule_statement: 350
  rule_cost: 300
  rule_when_broken: 300
  rule_truth: 350
  term_meaning: 200
entanglements:
  bond: 300
  edge: 300
  pressure_what: 450
  next_move: 300
  fact: 300
setup:
  normal: 700
  disruption: 700
  goal: 400
  stakes: 500
events:
  happened: 1100
  changed: 250
  # How many of the latest chapters are told in full. Older chapters shrink to their "changed" line.
  full_chapters_writer: 3
  full_chapters_planner: 4
beat:
  field: 500
chapter:
  # The section-by-section writer (inventory D5). The backend uses these; the prompts only need the words per section.
  target_words: 3000
  sections: 4
  tail_words: 300            # how much of the chapter so far each later section is shown
  short_ratio: 0.8           # an extra section is added when the words so far are under this share of the pace
