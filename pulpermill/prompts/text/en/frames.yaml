# Model-facing sentences that frame the rendered cards and records. English always (the output language is told to the
# model separately). Phrased positively. Tokens in {braces} are filled by pulpermill/prompts/render.py.

# ---- People ----
portraits_note: "These are the people on stage. Use their wants, fears, flaws and values to decide what they choose, and show the choice. Let a flaw cost someone something. Let competence show in how a person handles a task. Let each person's way of speaking show in what they say. Dispositions are tendencies: draw on the one the moment calls for, and let the others rest."
sketch: "Who {name} is: {value}"
offstage_marker: "[offstage]"
offstage_note: "People and groups marked [offstage] are somewhere else. They may be mentioned or thought of; only the people on stage appear in the scene."
# Three lines of the Characters wording rewritten so that they agree with the person's sex (she, he or they). The schema's
# own lead-ins say "themselves" and "they" for everyone, which reads wrongly beside a named woman or man.
portrait_fear: "{name} avoids and protects {themselves} from: {value}"
portrait_flaw: "{name} holds a false belief or blind spot that sabotages {their} own aims: {value}"
portrait_behavior: "when {state}, the tendency is to {tendency}"

# ---- World ----
places_other: "Other places in {name}: {items}."
object_held: "Held by {held_by}."
uses_none: "Not used in any chapter yet."
uses_some: "Used in {n} earlier chapter{s}."
power_felt_only: "{name}: Ordinary people feel it as {felt}"

# ---- The story so far ----
story_lead: "The story so far:"
story_chapter: "Chapter {chapter}. {happened}"
story_changed: "By its end: {changed}"
story_older: "Chapter {chapter}: {text}"
story_older_lead: "Earlier chapters, in brief:"
story_none: "This is the first chapter."
chapter_of: "This is chapter {n} of {total}."
chapter_of_unknown: "This is chapter {n}."
chapter_last: "This is the last chapter. Bring the story to its close and settle what the story set in motion, then stop."
chapter_one_normal: "Open the story where ordinary life was: {value}"
chapter_one_break: "What just broke it: {value}"

# ---- History (what happened and what changed) ----
history_lead_writer: "The story so far:"
history_lead_planner: "What has happened so far, and what each chapter changed:"

# ---- The spotlight tie ----
spotlight_tie: "This chapter puts one tie in the spotlight: {tie_from} toward {tie_to}: {bond}"
spotlight_tie_bare: "This chapter puts one tie in the spotlight: {tie_from} toward {tie_to}."
spotlight_drive: "What drives {tie_from} in this tie: {edge}"
spotlight_brief_lead: "The two people at its ends, in brief:"

# ---- The scene (a beat in prose) ----
scene_spotlight_line: "{tie_from} toward {tie_to}: {bond}"
scene_minor_roles: "Anyone else the scene needs appears by role only (a clerk, a neighbour), unnamed and in the background."
scene_writer_note: "Begin with the scene already in motion, and tell the plan as a living scene that is free to find better moments than the plan lists."

# ---- A change recorded for a card (one shift entry in prose) ----
shift_set: "{field} is now {value}"
shift_add: "{field} gains: {values}"
shift_replace: "{field}: {old} becomes {values}"
shift_remove: "{field} no longer includes {old}"
shift_unknown_item: "an earlier entry"

# ---- Earlier beats ----
planner_beats_lead: "Earlier chapters' plans, as a timeline:"
planner_beat_item: "Chapter {chapter}: at {where}, {when}."
