# Model-facing sentences that frame the rendered cards and records. English always (the output language is told to the
# model separately). Phrased positively. Tokens in {braces} are filled by pulpermill/prompts/render.py.

# ---- People ----
portraits_note: "These are the people on stage. Use their wants, fears, flaws and values to decide what they choose, and show the choice. Let a flaw cost someone something. Let competence show in how a person handles a task. Let each person's way of speaking show in what they say. Dispositions are tendencies: draw on the one the moment calls for, and let the others rest. People outside the spotlight tie are supporting: they can pull on the tie or react to it, and the scene stays about the tie."
sketch: "Who {name} is: {value}"
offstage_marker: "[offstage]"
offstage_note: "People and groups marked [offstage] are somewhere else. They may be mentioned or thought of; only the people on stage appear in the scene."
# Three lines of the Characters wording rewritten so that they agree with the person's sex (she, he or they). The schema's
# own lead-ins say "themselves" and "they" for everyone, which reads wrongly beside a named woman or man.
portrait_fear: "{name} avoids and protects {themselves} from: {value}"
portrait_flaw: "{name} holds a false belief or blind spot that sabotages {their} own aims: {value}"
portrait_behavior: "when {state}, the tendency is to {tendency}"

# ---- World ----
places_other: "Other places in {name}: {items}."
object_held: "Held by {held_by}."
uses_none: "Not used in any chapter yet."
uses_some: "Used in {n} earlier chapter{s}."
power_felt_only: "{name}, as ordinary people feel it: {felt}"

# ---- The story so far ----
story_lead: "The story so far:"
story_chapter: "Chapter {chapter}. {happened}"
story_changed: "By its end: {changed}"
story_older: "Chapter {chapter}: {text}"
story_older_lead: "Earlier chapters, in brief:"
story_none: "This is the first chapter."
chapter_of: "This is chapter {n} of {total}."
chapter_of_unknown: "This is chapter {n}."
chapter_last: "This is the last chapter. Bring the story to its close: settle the collision and what the story set in motion for good, open nothing new, then stop."
chapter_one_normal: "Open the story where ordinary life was: {value}"
chapter_one_break: "What just broke it: {value}"
origin_history_lead: "What broke the story open, and is still unresolved: {value}"
origin_history_note: "This remains in effect until the story resolves it. The story so far below shows how far it has moved, and this chapter begins from where the story so far leaves off."

# ---- History (what happened and what changed) ----
history_lead_writer: "The story so far:"
history_lead_planner: "What has happened so far, and what each chapter changed. Each chapter's closing line says how its collision came out and where that left the protagonist's aim and the tie; begin from the latest one:"

# ---- The spotlight tie ----
spotlight_tie: "This chapter puts one tie in the spotlight: {tie_from} toward {tie_to}: {bond}"
spotlight_tie_bare: "This chapter puts one tie in the spotlight: {tie_from} toward {tie_to}."
spotlight_drive: "What drives {tie_from} in this tie: {edge}"
spotlight_brief_lead: "The two people at its ends, in brief:"

# ---- The scene (a beat in prose) ----
scene_spotlight_line: "{tie_from} toward {tie_to}: {bond}"
scene_minor_roles: "The cast is fixed, and a name for anyone else would be a new character the reader has to keep track of. Refer to anyone else by what they do or by one telling detail, in the narration and in what people say to them, taken from this story's own world. The world is full of other people and none of them has a name; only places, events and things do."
scene_writer_note: "Begin with the scene already in motion, and tell the plan as a living scene that is free to find better moments than the plan lists."

# ---- A change recorded for a card (one shift entry in prose) ----
shift_set: "{field} is now {value}"
shift_add: "{field} gains: {values}"
shift_replace: "{field}: {old} becomes {values}"
shift_remove: "{field} no longer includes {old}"
shift_unknown_item: "an earlier entry"

# ---- Earlier beats ----
planner_beats_lead: "Earlier chapters' plans, as a timeline:"
planner_beat_item: "Chapter {chapter}: at {where}, {when}."
planner_beat_tie: "It was about {tie}."
planner_beat_pressure: "It put this to work: {pressure}."

# ---- The chapter's pressure (one world rule or object that must act on the aim or the tie) ----
pressure_line_rule: "This chapter, the rule below is a part of the collision, whether or not it has anything to do with the aim or the tie to begin with: it enters the conflict and pulls against what someone wants. By the climax it is decided in a way that costs someone something they feel: the rule is kept at its price, bent, or broken, and what follows its breaking happens. The rule itself stays as it is. Merely being in the scene does not count."
pressure_line_object: "This chapter, the object below is a part of the collision, whether or not it has anything to do with the aim or the tie to begin with: it enters the conflict and pulls against what someone wants. If the story goes that way, it is used, damaged, lost or passes to someone else, in a way that changes what comes next; if not, it still changes what someone can do or costs someone something. Merely being in the scene does not count."
pressure_kind_rule: "rule"
pressure_kind_object: "object"
pressure_rule: "{statement} Cost: {cost} When broken: {when_broken}"
pressure_object: "{name}: {description} Why it matters: {significance}"
