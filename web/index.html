<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulpermill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Pulpermill</h1>
    <div class="bar-actions">
      <button type="button" id="open">Open project</button>
      <button type="button" id="save">Save project</button>
      <input type="file" id="open-file" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav id="cards" class="tabs" aria-label="Cards"></nav>
  <nav id="people" class="tabs people" aria-label="Characters" hidden></nav>
  <main id="card"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
