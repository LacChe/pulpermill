<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="page.title"></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 data-text="page.title"></h1>
    <label class="project-name">
      <span class="visually-hidden" data-text="page.projectName"></span>
      <input type="text" id="title" class="text-control" data-text-attrs="placeholder:app.untitled" autocomplete="off">
    </label>
    <span id="save-state" class="save-state" role="status"></span>
    <div class="bar-actions">
      <button type="button" id="new" data-text="page.new"></button>
      <button type="button" id="open" data-text="page.open"></button>
      <button type="button" id="import" data-text="page.import"></button>
      <button type="button" id="guide" aria-controls="welcome" aria-expanded="true" data-text="page.guide"></button>
      <button type="button" id="save" data-text="page.save"></button>
      <input type="file" id="open-file" accept=".json,application/json" hidden>
      <input type="file" id="import-file" accept=".json,application/json" multiple hidden>
    </div>
  </header>
  <div class="backend-bar">
    <label class="backend">
      <span data-text="page.modelConnection"></span>
      <input type="text" id="backend" class="text-control" autocomplete="off" spellcheck="false">
    </label>
    <label class="backend token">
      <span data-text="page.tokenLabel"></span>
      <input type="password" id="token" class="text-control" autocomplete="off" spellcheck="false" data-text-attrs="title:page.tokenHelp">
    </label>
    <span id="connection" class="connection" role="status"></span>
    <button type="button" id="check" data-text="page.check"></button>
    <button type="button" id="stop" class="stop" hidden data-text="page.stop"></button>
  </div>
  <div id="recovery" class="notice" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="welcome" class="welcome" data-text-attrs="aria-label:page.welcomeLabel" hidden></section>
  <section id="column-switcher" class="column-switcher" role="group" data-text-attrs="aria-label:page.columnSwitcher">
    <button type="button" class="column-switch active" data-column="cards" data-text="page.cardsColumn"></button>
    <button type="button" class="column-switch" data-column="planning" data-text="page.planningColumn"></button>
  </section>
  <div id="workspace" class="workspace" data-column="cards">
    <section class="cards-column" data-text-attrs="aria-label:page.cardsColumn">
      <nav id="cards" class="tabs" data-text-attrs="aria-label:page.cardsLabel"></nav>
      <nav id="people" class="tabs people" data-text-attrs="aria-label:page.peopleLabel" hidden></nav>
      <section id="import-panel" class="import-panel" data-text-attrs="aria-label:import.title" hidden></section>
      <main id="card"></main>
    </section>
    <section class="planning-column" data-text-attrs="aria-label:page.planningColumn">
      <div id="story-bar" class="story-bar"></div>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
