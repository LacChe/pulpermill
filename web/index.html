<!doctype html>
<html lang="en" data-theme="timber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="page.title"></title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%232D241B' stroke='%234B3D2E' stroke-width='2'/%3E%3Ctext x='32' y='35' font-family='system-ui,sans-serif' font-weight='700' font-size='42' text-anchor='middle' dominant-baseline='middle' fill='%235FBFB2'%3EP%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#231B14">
  <!-- A saved theme goes on before the first paint, so the page never shows the default and then changes. The key and the names
       are the same as theme.js's; a test keeps the two in step. -->
  <script>try{var t=localStorage.getItem("pulpermill.theme");if(/^(timber|circuit|flour|paper|stone|pulp)$/.test(t))document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="app-header">
    <header class="bar" data-locks>
      <h1 data-text="page.title"></h1>
      <label class="project-name">
        <span class="visually-hidden" data-text="page.projectName"></span>
        <input type="text" id="title" class="text-control" data-text-attrs="placeholder:app.untitled" autocomplete="off">
      </label>
      <span id="save-state" class="save-state" role="status"></span>
      <div class="bar-actions">
        <button type="button" id="new" data-text="page.new"></button>
        <button type="button" id="open" data-text="page.open"></button>
        <button type="button" id="import" data-text="page.import"></button>
        <button type="button" id="guide" aria-controls="welcome" aria-expanded="true" data-text="page.guide"></button>
        <button type="button" id="save" data-text="page.save"></button>
        <input type="file" id="open-file" accept=".json,application/json" hidden>
        <input type="file" id="import-file" accept=".json,application/json" multiple hidden>
        <div id="language" class="language-switch" role="group" data-text-attrs="aria-label:page.language"></div>
      </div>
    </header>
    <div class="backend-bar">
      <label class="backend" data-locks>
        <span data-text="page.modelConnection"></span>
        <input type="text" id="backend" class="text-control" autocomplete="off" spellcheck="false">
      </label>
      <label class="backend token" data-locks>
        <span data-text="page.tokenLabel"></span>
        <input type="password" id="token" class="text-control" autocomplete="off" spellcheck="false" data-text-attrs="title:page.tokenHelp">
      </label>
      <span id="connection" class="connection" role="status"></span>
      <button type="button" id="check" data-text="page.check"></button>
      <button type="button" id="stop" class="stop" hidden data-text="page.stop"></button>
    </div>
  </div>
  <div id="recovery" class="notice" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="welcome" class="welcome" data-locks data-text-attrs="aria-label:page.welcomeLabel" hidden></section>
  <section id="column-switcher" class="column-switcher" role="group" data-locks data-text-attrs="aria-label:page.columnSwitcher">
    <button type="button" class="column-switch active" data-column="cards" data-text="page.cardsColumn"></button>
    <button type="button" class="column-switch" data-column="planning" data-text="page.planningColumn"></button>
  </section>
  <div id="workspace" class="workspace" data-column="cards">
    <section class="cards-column" data-text-attrs="aria-label:page.cardsColumn">
      <div class="cards-nav" data-locks>
        <nav id="cards" class="tabs" data-text-attrs="aria-label:page.cardsLabel"></nav>
        <nav id="people" class="tabs people" data-text-attrs="aria-label:page.peopleLabel" hidden></nav>
      </div>
      <section id="import-panel" class="import-panel" data-locks data-text-attrs="aria-label:import.title" hidden></section>
      <main id="card" data-locks></main>
    </section>
    <section class="planning-column" data-text-attrs="aria-label:page.planningColumn">
      <nav id="chapters" class="tabs chapter-tabs" data-locks data-text-attrs="aria-label:page.chaptersLabel" hidden></nav>
      <div id="planning-panels" data-locks></div>
      <div id="story-bar" class="story-bar" data-locks></div>
    </section>
  </div>
  <footer id="theme-bar" class="theme-bar"></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
